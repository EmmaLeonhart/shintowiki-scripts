name: Wiki-editing gate

# Emma 2026-07-11: the work-loop shouldn't spin on decisions while Miraheze wiki
# editing is down. This job runs hourly, checks whether the login works
# (check_wiki_login.py — the anti-DDoS 403 goes away when Miraheze stops
# challenging the runner IPs), and writes the result as a GO/WAIT marker at the
# top of queue.md. The work-loop pulls each hour and, when it sees GO, starts
# clearing the decisions. No human ping — the marker IS the signal.

on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the :00 mark
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-editing-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check login and flip the queue marker
        run: |
          if python shinto_miraheze/check_wiki_login.py; then
            STATE=GO
          else
            STATE=WAIT
          fi
          echo "login check: $STATE"
          python - "$STATE" <<'PY'
          import sys, re, datetime, pathlib
          state = sys.argv[1]                       # GO or WAIT
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          q = pathlib.Path("queue.md")
          text = q.read_text(encoding="utf-8")
          new_marker = f"<!-- WIKI_GATE: {state} -->"
          text2 = re.sub(r"<!-- WIKI_GATE: (?:GO|WAIT) -->", new_marker, text, count=1)
          if state == "GO":
              status = (f"**Status: 🟢 GO** (login OK, checked {stamp})"
                        " — wiki editing is live; work-loop, start clearing the ❓ DECISIONS below.")
          else:
              status = (f"**Status: ⏸ WAITING** (Miraheze 403, checked {stamp})"
                        " — wiki editing is blocked. The hourly `wiki-editing-gate.yml` CI job runs"
                        " `check_wiki_login.py` and flips the marker above to **`WIKI_GATE: GO`** the"
                        " moment the login works again.")
          text2 = re.sub(r"\*\*Status: (?:🟢 GO|⏸ WAITING)\*\*[^\n]*?(?=\n)", status, text2, count=1)
          q.write_text(text2, encoding="utf-8")
          print("marker ->", state)
          PY

      - name: Commit if the marker changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f queue.md
          if git diff --cached --quiet; then
            echo "gate unchanged"
          else
            git commit -m "chore: wiki-editing gate marker update [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              git fetch origin "$GITHUB_REF_NAME" || true
              git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi
