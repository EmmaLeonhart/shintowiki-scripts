name: Monthly Verification Sweep

# Once a month, PREPEND a task to queue.md telling the agent to walk
# docs/deferred_verification.md and actually TEST each open item. Wiki/CI
# changes here are lagging indicators that can take hours to manifest, so the
# working rule is "ship it and move on" — things go out unverified. This sweep
# is the batched catch-up: the verification we skip in the moment.
#
# This workflow does NOT do the verification itself — it only schedules it into
# the queue, where the autonomous work-loop picks it up.
#
# Idempotent: a marker comment (<!-- monthly-verify-sweep -->) guards against
# stacking a second block if the previous month's task is still unconsumed.
#
# Commits with [skip ci] so it doesn't trigger the cleanup pipeline.

on:
  schedule:
    # 1st of the month, 07:23 UTC (off the :00 mark to avoid the herd)
    - cron: "23 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Prepend verification-sweep task to queue.md
        run: |
          python3 - <<'PY'
          import datetime, pathlib, sys

          MARKER = "<!-- monthly-verify-sweep -->"
          q = pathlib.Path("queue.md")
          text = q.read_text(encoding="utf-8")

          if MARKER in text:
              print("An unconsumed monthly-verify-sweep block is already in "
                    "queue.md; not adding another.")
              sys.exit(0)

          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          block = (
              f"## Monthly verification sweep ({MARKER} {today})\n\n"
              "Walk `docs/deferred_verification.md` and actually TEST each Open item "
              "(the batched verification we skip in the moment because wiki/CI changes "
              "are slow lagging indicators). For each: run its check; if it works, move "
              "it to the doc's Verified section with the date + what you observed; if "
              "it's broken, fix it and note the fix. Then delete THIS block.\n\n"
          )

          # Insert as the first work item: before the first '## ' heading,
          # after the queue.md preamble.
          lines = text.splitlines(keepends=True)
          insert_at = next((i for i, ln in enumerate(lines)
                            if ln.startswith("## ")), len(lines))
          new_text = "".join(lines[:insert_at]) + block + "".join(lines[insert_at:])
          q.write_text(new_text, encoding="utf-8")
          print(f"Prepended monthly verification sweep task dated {today}.")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet queue.md; then
            echo "queue.md unchanged; nothing to commit."
            exit 0
          fi
          git add queue.md
          git commit -m "chore: schedule monthly verification sweep into queue.md [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; pulling --rebase and retrying"
            git pull --rebase
          done
          echo "All push attempts exhausted" >&2
          exit 1
