name: Generate GitHub Pages

on:
  workflow_dispatch:
  workflow_call:
  # Standalone daily schedule (re-added 2026-06-08). It was removed in ddddffb6
  # so Pages would only run as the tail of cleanup-loop (to avoid concurrent
  # _site merge conflicts). But cleanup-loop is now ~always cancelled
  # (cancel-in-progress + frequent pushes + its multi-hour runtime), so it never
  # reaches this job and Pages starved (last build 2026-05-31). The merge-conflict
  # risk was since mitigated (d0bc7816: commit full _site, CI updates it), and the
  # `pages` concurrency group makes a scheduled run + a cleanup-loop call coexist
  # safely. 07:23 UTC avoids the cleanup-loop's 0/6/12/18 fires.
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download QS site artifact
        id: download-qs
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-site
          path: modern-quickstatements/_site/
        continue-on-error: true

      - name: Use committed files as fallback (no SPARQL re-query)
        if: steps.download-qs.outcome == 'failure'
        run: |
          echo "No QS site artifact found — using committed repo files as fallback."
          echo "These files are updated by generate-quickstatements on each successful run."
          ls -la modern-quickstatements/_site/ 2>/dev/null || echo "WARNING: no _site/ files in repo either"

      - name: Generate main site
        run: python3 site/generate_pages.py

      - name: Generate run history page
        working-directory: modern-quickstatements
        run: python generate_run_history.py

      - name: Generate Shikinaisha orphan table (live SPARQL)
        working-directory: modern-quickstatements
        run: python generate_shikinaisha_orphan_page.py
        continue-on-error: true

      - name: Generate Kokugakuin missing-id table (from committed report)
        working-directory: modern-quickstatements
        run: python generate_kokugakuin_id_page.py
        continue-on-error: true

      - name: Generate Awa entry-3 explainer (static)
        working-directory: modern-quickstatements
        run: python generate_awa_entry3_page.py
        continue-on-error: true

      - name: Generate Izumo 韓国伊太弖 report (from committed doc)
        working-directory: modern-quickstatements
        run: python generate_izumo_karakuni_page.py
        continue-on-error: true

      - name: Combine sites
        run: |
          # Copy QS dashboard pages into main _site, renaming index to avoid collision
          cp modern-quickstatements/_site/index.html _site/shrine-ranking.html
          cp modern-quickstatements/_site/daily.html _site/daily.html 2>/dev/null || true
          cp modern-quickstatements/_site/runs.html _site/runs.html 2>/dev/null || true
          # Copy all QS text files and summary
          cp modern-quickstatements/_site/*.txt _site/ 2>/dev/null || true
          cp modern-quickstatements/_site/summary.json _site/quickstatements-summary.json 2>/dev/null || true
          # Publish the merged label-generator report as a subpage; the
          # standalone shinto-label-generator repo's Pages redirects here.
          mkdir -p _site/shinto-label-generator
          cp -r shinto-label-generator/docs/* _site/shinto-label-generator/ 2>/dev/null || true

      - name: Commit updated _site to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Save generated files before any git operations
          cp -r _site/ /tmp/_site_backup/
          # Check if there are actual changes
          git add -f _site/
          if git diff --cached --quiet; then
            echo "No _site changes to commit"
          else
            # Reset index so we can pull cleanly
            git reset HEAD -- . > /dev/null 2>&1 || true
            git checkout -- . || true
            git clean -fd _site/ || true
            git fetch origin "$GITHUB_REF_NAME" || true
            git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
            # Re-apply our generated files and commit
            cp -r /tmp/_site_backup/* _site/
            git add -f _site/
            git commit -m "chore: update _site from pages build [skip ci]"
            # Push with fetch-rebase-retry. Sibling cleanup-loop jobs (state
            # commits, syncs) push to main concurrently, so a single push races
            # and gets rejected (! [rejected] main -> main). Without a retry loop
            # this step reddened the WHOLE cleanup-loop run — the 2026-07-06
            # failure root cause. Same load-bearing pattern as commit_state.sh.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed _site on attempt $attempt"; pushed=true; break
              fi
              echo "push rejected (attempt $attempt/5); rebasing on updated remote"
              git fetch origin "$GITHUB_REF_NAME" || true
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                # _site conflicts with a concurrent change: our freshly-built
                # copy wins — reset to remote and re-apply.
                git rebase --abort || true
                git reset --hard "origin/$GITHUB_REF_NAME"
                cp -r /tmp/_site_backup/* _site/
                git add -f _site/
                git commit -m "chore: update _site from pages build [skip ci]"
              fi
              sleep $((attempt * 3))
            done
            # _site is cosmetic (Pages deploys from the uploaded artifact, not the
            # repo commit), so a persistent push race must NOT redden the run —
            # the next build refreshes it. Mirror commit_state.sh: warn, exit 0.
            if [ "$pushed" != "true" ]; then
              echo "WARNING: _site push failed after 5 attempts; next build updates it."
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
