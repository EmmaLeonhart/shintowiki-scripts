name: Configure Wikidata Link Grok Categories

# Edit the repo file `miraheze_unique/Template%3AWikidata link.wiki` to
# install / refresh the conditional Grokipedia categorisation snippet,
# then commit + push. The next cleanup-loop run propagates the file to
# the live wiki via `sync_miraheze_unique_pages.py` (repo-wins for that
# directory, so the repo is the source of truth — see CLAUDE.md and the
# 2026-05-27 fix in commit bd4b937d).
#
# Idempotent: the configure script's `_replace_or_append` helper splices
# the snippet in place of any existing marker block, or appends one if
# none is present. Re-running on an already-current file is a no-op.
#
# Trigger manually from the Actions tab (workflow_dispatch). Not wired
# into cleanup-loop — re-run only when the snippet itself needs to change.
# No wiki credentials required: this workflow never touches the wiki
# directly.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Apply GROK_BLOCK to repo file (no wiki access)"
        run: |
          python3 shinto_miraheze/configure_wikidata_link_grok_categories.py \
            --apply \
            --run-tag "configure-wikidata-link-grok-categories workflow_dispatch run ${GITHUB_RUN_ID}"

      - name: "Commit + push if the file changed"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "miraheze_unique/Template%3AWikidata link.wiki"
          if git diff --cached --quiet; then
            echo "Repo file already current — nothing to commit."
            exit 0
          fi
          RUN_PATH="${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG=$(printf '%s\n\n%s\n' \
            "ci(grok): refresh Template:Wikidata link GROK_BLOCK [skip ci]" \
            "Triggered by [[github:${RUN_PATH}|configure-wikidata-link-grok-categories]]. Re-applied the conditional GROK_BLOCK to the repo file; the next sync_miraheze_unique_pages run will propagate to shinto.miraheze.org.")
          git commit -m "$MSG"
          git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed."
