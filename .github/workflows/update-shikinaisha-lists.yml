name: Update Shikinaisha Lists

# Regenerates "List of Shikinaisha in X Province" pages from Wikidata via the
# revived shinto_miraheze/update_shikinaisha_lists.py (2026-07-04) — these
# pages were always generated; the old generator was archived and its progress
# file froze them. Dispatch with `pages` for a targeted overwrite (default:
# the two Awa provinces, per Emma 2026-07-04) or empty `pages` for a full
# prefix sweep.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Semicolon-separated exact page titles (empty = full 'List of Shikinaisha in' prefix sweep)"
        type: string
        default: ""
      max_edits:
        description: "Page-save cap"
        type: string
        default: "100"
  schedule:
    # Daily full sweep (Emma's original spec: "regenerating ~daily").
    # 18:37 UTC keeps clear of the ~06:00 UTC cleanup-loop's ~8h window.
    # With batched wbgetentities (50 ids/call) a full ~68-province sweep is
    # tractable; progress state is runner-local so every scheduled run is a
    # fresh full sweep.
    - cron: "37 18 * * *"

permissions:
  contents: write

# A dispatch and the daily schedule must not run concurrently (double-editing
# the same pages); queue instead of cancel.
concurrency:
  group: update-shikinaisha-lists
  cancel-in-progress: false

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-lists:
    runs-on: ubuntu-latest
    # Job stays under the 6h hosted max; the STEP timeout below leaves
    # headroom so the progress-commit step still runs after a timeout
    # (the 2026-07-04 full-sweep dispatch died at the old 170-min job
    # timeout and lost its progress entirely).
    timeout-minutes: 355
    env:
      WIKI_USERNAME: ${{ vars.WIKI_USERNAME }}
      WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Week-long wiki-editing lockout guard (Emma 2026-07-11). This writes the
      # Shikinaisha list pages on Miraheze; skip while the lockout is in force.
      # See docs/wiki_403_audit_2026-07-11.md.
      - name: Wiki-editing lockout guard
        id: lockout
        run: |
          if python3 shinto_miraheze/wiki_edit_allowed.py; then
            echo "locked=false" >> "$GITHUB_OUTPUT"
          else
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki-editing lockout::Wiki editing is locked — skipping the Shikinaisha-list regeneration this run."
          fi

      - name: Build run tag
        run: |
          RUN_PATH="${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "${GITHUB_EVENT_NAME}" in
            schedule) CAUSE="time triggered pipeline" ;;
            *)        CAUSE="manual triggered pipeline" ;;
          esac
          echo "RUN_TAG=[[github:${RUN_PATH}|${CAUSE}]]" >> "$GITHUB_ENV"

      - name: Regenerate lists
        if: steps.lockout.outputs.locked != 'true'
        # inputs.* are empty on schedule triggers: empty max_edits falls back
        # to 100, empty pages means the full prefix sweep. Step timeout <
        # job timeout so the progress-commit step below still runs.
        timeout-minutes: 340
        run: |
          python3 -u -m shinto_miraheze.update_shikinaisha_lists \
            --apply --max-edits "${{ inputs.max_edits || '100' }}" \
            --run-tag "${RUN_TAG}" \
            --pages "${{ inputs.pages }}"

      - name: Commit sweep progress
        # Progress must survive across runs: a timed-out sweep resumes where
        # it stopped tomorrow; a completed sweep clears the file (the script
        # deletes it) so the next cycle starts fresh.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shinto_miraheze/shiki_list_progress.json || true
          if git diff --cached --quiet; then
            echo "No progress change to commit."
          else
            git commit -m "chore(state): shikinaisha list sweep progress [skip ci]"
            git push || { git pull --rebase --autostash && git push; }
          fi
