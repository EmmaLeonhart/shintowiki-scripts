name: Bump agentic-vectorization submodule

# Emma, 2026-10-08: "Add agentic-vectorization as a submodule and set up GitHub
# Actions ... so that in the daily actions run, the submodule is bumped up to the
# current version."
#
# agentic-vectorization/ tracks the main branch of
# EmmaLeonhart/commons-png-to-svg-vectorization (public; .gitmodules sets
# branch = main). Once a day this moves the submodule pointer to that branch's
# current head and commits it. Nothing else here checks the submodule out, so no
# other workflow is affected.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-agentic-vectorization
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Move the submodule to the current head of its branch
        run: |
          set -euo pipefail
          git submodule update --init --remote --depth 1 agentic-vectorization
          echo "agentic-vectorization now at $(git -C agentic-vectorization rev-parse --short HEAD)"

      - name: Commit and push if it moved
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentic-vectorization
          if git diff --cached --quiet; then
            echo "Submodule already current; nothing to commit."
            exit 0
          fi
          NEW="$(git -C agentic-vectorization rev-parse --short HEAD)"
          git commit -m "chore: bump agentic-vectorization to ${NEW} [skip ci]"
          # Same retry shape as shinto_miraheze/commit_state.sh: other workflows push
          # to main too, and a single rejected push would drop the bump.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Rebase failed; the bump will be retried on the next run."
              exit 0
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed bump to ${NEW} (attempt ${attempt})."
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::warning::Could not push the submodule bump after 6 attempts; next run retries."
