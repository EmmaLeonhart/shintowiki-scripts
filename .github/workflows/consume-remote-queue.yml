name: Consume Remote Queue

# Consumes remote_queue.json — picks N items, calls Claude via the
# Anthropic API to apply each item's per-file instruction, commits the
# touched files. The downstream wiki-cleanup sync turns the file changes
# into wiki edits and (for items whose categories drop) deletes the local
# file; the next nightly remote-queue rebuild reflects that.
#
# Pacing: every 2 hours, 3 items per run (~36 items/day, ~30 days to
# drain the current 1,097-item queue). Tune via the workflow_dispatch
# input or by changing the cron / N below.
#
# Requires repo secret ANTHROPIC_API_KEY. If absent, runs error out at
# the Anthropic SDK call; nothing destructive happens locally.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_edits:
        description: "Items to process this run (default 3, cap 20)"
        type: string
        default: "3"

permissions:
  contents: write

concurrency:
  group: consume-remote-queue
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Consume queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          N="${{ github.event.inputs.max_edits || '3' }}"
          python3 consume_remote_queue.py --apply --max-edits "$N"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes; nothing to commit"
            exit 0
          fi
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git commit -m "chore(remote-queue): consume items [skip ci]

          Run: ${RUN_URL}"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; pulling --rebase and retrying"
            git pull --rebase
          done
          echo "all push attempts exhausted" >&2
          exit 1
