name: Random Wait

on:
  workflow_dispatch:
  workflow_call:

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay before submission
        run: |
          DELAY=$((RANDOM % 3600 + 1))
          echo "Waiting ${DELAY}s ($((DELAY / 60))m $((DELAY % 60))s)..."
          sleep $DELAY
