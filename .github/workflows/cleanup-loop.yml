name: shinto-cleanup-loop

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.state"
      - "**/*.log"
      - "**/*.errors"
  schedule:
    # Every 6 hours. Each fire runs the full pipeline; concurrency
    # `cancel-in-progress: true` evicts any prior run still going so
    # back-to-back orchestrator sweeps don't pile up.
    - cron: "0 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shinto-cleanup-loop
  # Was `false` historically so long orchestrator runs finished cleanly.
  # Flipped to `true` on 2026-04-24 after a cleanup job hung for hours
  # on audit_double_category_qids and manual `gh run cancel` didn't
  # propagate. With this on, any new push / schedule fires will cancel
  # the prior stuck run instead of queueing behind it.
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # window-gate publishes per-orchestrator edit limits (uniform 100 by
  # default; can be bumped via workflow_dispatch input on the individual
  # orchestrator workflows if needed). It also gates the *wikidata-editing*
  # jobs (submit-quickstatements, wikidata-qualifier-edit, direct-daily-edits)
  # to once per day on the 00:00 UTC cron fire, so the daily wikidata edit
  # budget stays bounded. Orchestrator sweeps still run every cron fire.
  #
  # Historical note: this job used to gate the *whole* pipeline to 00:00 UTC
  # only. That behaviour was paired with a catch-up window
  # (2026-04-23 → 2026-06-01) that overrode the gate so all four slots ran
  # during catch-up. When the catch-up override was removed on 2026-05-02
  # the off-hour gate was inadvertently left in place, silently turning
  # 3-of-4 cron fires into no-ops. The full-pipeline off-hour gate was
  # removed on 2026-05-03. The narrower wikidata-only daily gate was
  # restored on 2026-05-04 because, without it, every 6h fire was running
  # 100 QS submissions + 100 P459 qualifier edits + (on QS-fail) 100
  # direct-API fallback edits — up to ~800 wikidata edits/day, with the
  # direct-fallback run alone taking ~5 hours due to its 1–5 min random
  # inter-edit delays.
  window-gate:
    runs-on: ubuntu-latest
    outputs:
      mainspace-edit-limit: ${{ steps.check.outputs.mainspace-edit-limit }}
      template-edit-limit: ${{ steps.check.outputs.template-edit-limit }}
      category-edit-limit: ${{ steps.check.outputs.category-edit-limit }}
      misc-edit-limit:     ${{ steps.check.outputs.misc-edit-limit }}
      wikidata-daily-fire: ${{ steps.check.outputs.wikidata-daily-fire }}
    steps:
      - name: Checkout (needed to read modern-quickstatements/reports/)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - id: check
        run: |
          # Per-orchestrator edit limits.
          #
          # The mainspace/template/category limits below are PER WORKFLOW
          # FIRE — each value is the cap that single orchestrator job
          # applies. The misc limit is PER NAMESPACE: misc-edit-limit is
          # passed into nine separate ns-orchestrator-runner invocations
          # (user, project, file, help, geojson, module, item, property,
          # talk), so a value of 10 means up to 10 edits in EACH of those
          # nine namespaces — ~90 misc edits total per cleanup-loop fire.
          #
          # Pre-June-2026 push (window 2026-05-08 → 2026-06-01):
          #   mainspace 500 (history-offload catch-up — fandom mirroring
          #     is mostly done and we want to flush the remaining queue
          #     before history_offload's June cutoff)
          #   category  500 (catch-up window: never completed a full cycle.
          #     User directive 2026-05-12: keep at 500 during catch-up —
          #     getting through the queue matters. Paired with the
          #     180-minute per-step timeout in category-orchestrator.yml,
          #     so if a single fire CAN'T finish 500 edits inside 3h it
          #     dies fast and the NEXT cleanup-loop fire takes a fresh
          #     stab rather than burning 5.5h on a wedged page.)
          #   template   10 (low-priority: small namespace, mostly stable)
          #   misc       10 per namespace × 9 misc namespaces = ~90/fire
          #
          # On/after 2026-06-01: revert mainspace and template to the
          # steady-state cap of 100 each. Category catch-up also ends
          # naturally — drop it back to 100. misc stays at 10/ns.
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" \< "2026-06-01" ]; then
            echo "mainspace-edit-limit=500" >> "$GITHUB_OUTPUT"
            echo "template-edit-limit=10"   >> "$GITHUB_OUTPUT"
            echo "category-edit-limit=500"  >> "$GITHUB_OUTPUT"
            echo "misc-edit-limit=10"       >> "$GITHUB_OUTPUT"
            echo "Pre-June push (until 2026-06-01): mainspace 500/fire, category 500/fire, template 10/fire, misc 10 per namespace × 9 namespaces (~90 misc edits/fire). Category step timeout-minutes=180 in category-orchestrator.yml caps the wall-clock — a run that can't finish 500 edits in 3h dies and lets the next fire start clean."
          else
            echo "mainspace-edit-limit=100" >> "$GITHUB_OUTPUT"
            echo "template-edit-limit=100"  >> "$GITHUB_OUTPUT"
            echo "category-edit-limit=100"  >> "$GITHUB_OUTPUT"
            echo "misc-edit-limit=10"       >> "$GITHUB_OUTPUT"
            echo "Steady state (post-2026-06-01): mainspace/template/category 100/fire each, misc 10 per namespace × 9 namespaces (~90 misc edits/fire)."
          fi

          # Wikidata-edit daily gate: fire on the FIRST cron run of each
          # UTC day, or any non-schedule trigger (workflow_dispatch / push).
          #
          # Previously this gated on `date -u +%H == 00`. That broke after
          # GitHub Actions cron skew started skipping the 00:00 fire — on
          # 2026-05-07 and 2026-05-08 the closest cron fire was 03:28 UTC,
          # so wikidata-daily-fire stayed false all day and the QS submit
          # (P6262, P11250, etc.) never ran. The date-based check below
          # fires whenever the most recent submission report's date is
          # older than today, regardless of which cron fire wins.
          # ── WIKIDATA EDITING FREEZE — hard pause until 2026-06-06 ──
          # Two-week halt set 2026-05-23 (after bespoke direct-API editors ran on
          # Wikidata). While frozen, wikidata-daily-fire is forced false so the
          # QuickStatements submission — the ONLY thing that edits Wikidata —
          # never runs, on ANY trigger. Auto-resumes 2026-06-06; to extend the
          # freeze, push the date out. Principle: being visible on Wikidata is
          # worse than losing data, so when in doubt this stays off.
          FREEZE_WIKIDATA_UNTIL="2026-06-06"
          if [ "$(date -u +%Y-%m-%d)" \< "$FREEZE_WIKIDATA_UNTIL" ]; then
            echo "wikidata-daily-fire=false" >> "$GITHUB_OUTPUT"
            echo "WIKIDATA FREEZE active until $FREEZE_WIKIDATA_UNTIL — NO Wikidata edits."
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "wikidata-daily-fire=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule trigger — wikidata-edit jobs will run."
          else
            LATEST_REPORT=$(ls modern-quickstatements/reports/*.json 2>/dev/null | sort -r | head -1 || true)
            if [ -n "$LATEST_REPORT" ]; then
              LATEST_DATE=$(basename "$LATEST_REPORT" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            else
              LATEST_DATE=""
            fi
            TODAY=$(date -u +%Y-%m-%d)
            if [ "$LATEST_DATE" != "$TODAY" ]; then
              echo "wikidata-daily-fire=true" >> "$GITHUB_OUTPUT"
              echo "Last submission report: ${LATEST_DATE:-none}; today is $TODAY — wikidata-edit jobs will run."
            else
              echo "wikidata-daily-fire=false" >> "$GITHUB_OUTPUT"
              echo "Already submitted today ($LATEST_DATE) — wikidata-edit jobs will skip."
            fi
          fi

  generate-quickstatements:
    needs: window-gate
    uses: ./.github/workflows/generate-quickstatements.yml

  # Build pages right after SPARQL generation (runs in parallel with cleanup)
  generate-pages:
    needs: [window-gate, generate-quickstatements]
    if: always()
    uses: ./.github/workflows/generate-pages.yml

  # cleanup depends on BOTH sync jobs (git-synced-sync, fandom-sync) so
  # the wiki begins each cycle in the repo's desired state BEFORE any
  # wiki-write job starts touching pages. Without these deps the syncs
  # were running in parallel with cleanup + orchestrators, and the
  # orchestrators' edits were being clobbered by stale repo content
  # pushed by a sync that landed after them. Emma's directive
  # 2026-05-26: "git syncing should be the first thing that occurs on
  # the wiki. The first thing on the wiki should be git syncing. Any
  # edits should happen after it." See queue.md "Bot ping-pong" +
  # todo.md.
  cleanup:
    needs: [window-gate, generate-quickstatements, git-synced-sync, fandom-sync]
    if: always()
    uses: ./.github/workflows/wiki-cleanup.yml
    secrets: inherit

  # General fandom cleanup loop — sits between the miraheze-side cleanup
  # job above (`wiki-cleanup.yml`) and the per-namespace orchestrators
  # below. Currently does ONE thing: drains the first 500 entries of
  # [[Special:WantedFiles]] on shinto.fandom.com by importing them from
  # Wikimedia Commons (when a corresponding file exists there) with
  # attribution. Bounded per-run by design — never iterates the whole
  # list. See .github/workflows/fandom-cleanup.yml for rationale.
  fandom-cleanup:
    needs: [window-gate, cleanup]
    if: always()
    uses: ./.github/workflows/fandom-cleanup.yml
    secrets: inherit

  # Untransclude CRUD templates — walks Category:CRUD templates and
  # rewrites every transclusion `{{Foo|...}}` → `{{Removed template|...}}`
  # plus every wikilink `[[Template:Foo]]` → `[[Template:Removed template]]`
  # so the parameter data is preserved on each page even as the
  # underlying crud template gets neutralised. Once a crud template has
  # zero references it falls into Special:UnusedTemplates and the
  # existing delete_unused_templates pipeline removes it. Slotted here
  # — between the general cleanup job and the per-namespace orchestrators
  # — so each orchestrator sweep sees pages already cleaned of crud-
  # template calls. Per-run caps (10 templates / 10 pages / 100 edits)
  # keep daily edit volume well-bounded across the 6h cleanup-loop
  # cadence; a human can intervene between any two runs without losing
  # progress (.state file resumes).
  untransclude-crud-templates:
    needs: [window-gate, cleanup, fandom-cleanup]
    if: always()
    uses: ./.github/workflows/untransclude-crud-templates.yml
    secrets: inherit

  # sync_git_synced_pages: bidirectional sync between
  # [[Category:Git synced pages]] on miraheze and the repo's git_synced/
  # directory.
  git-synced-sync:
    needs: window-gate
    uses: ./.github/workflows/git-synced-sync.yml
    secrets: inherit

  # Independent Pages Sync — runs the per-wiki bidirectional sync for
  # pages tagged [[Category:Independently git synced pages]] on each
  # wiki. miraheze_unique/ syncs to shinto.miraheze.org and fandom_unique/
  # syncs to shinto.fandom.com; the two wikis never write to each other.
  # Replaces the broken wiki-to-wiki sync_fandom_pages model.
  fandom-sync:
    needs: window-gate
    uses: ./.github/workflows/fandom-sync.yml
    secrets: inherit

  # Per-namespace orchestrators — each runs every per-page op whose
  # NAMESPACES includes its namespace, using a single shared state file
  # per namespace. Replaces the per-script state files of the cycling
  # scripts that used to live in wiki-cleanup.yml.
  # Template:Wikidata link has been updated (via git_synced/) to accept
  # the new positional |lang|title pairs (up to 20 pairs, params 2-41),
  # so enable_interlang_consolidate is now on for all four orchestrators.

  mainspace-orchestrator:
    needs: [window-gate, cleanup, fandom-cleanup, untransclude-crud-templates]
    if: always()
    uses: ./.github/workflows/mainspace-orchestrator.yml
    with:
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      enable_normalize_ill_wikidata: true
      edit_limit: ${{ needs.window-gate.outputs.mainspace-edit-limit }}
    secrets: inherit

  category-orchestrator:
    needs: [window-gate, mainspace-orchestrator]
    if: always()
    uses: ./.github/workflows/category-orchestrator.yml
    with:
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.category-edit-limit }}
    secrets: inherit

  template-orchestrator:
    needs: [window-gate, category-orchestrator]
    if: always()
    uses: ./.github/workflows/template-orchestrator.yml
    with:
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_template_usage_check: true
      enable_enwiki_wikidata_link: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.template-edit-limit }}
    secrets: inherit

  # Per-namespace orchestrators for the misc namespaces. Replaces the
  # old monolithic miscellaneous-orchestrator (which swept 9 namespaces
  # under one shared budget) with one orchestrator per namespace, each
  # at 10 edits/run. Talk pages are bundled into a single orchestrator
  # (low-stakes, 12 talk namespaces sharing one budget). MediaWiki (ns=8)
  # is intentionally excluded — interface messages too sensitive.
  user-orchestrator:
    needs: [window-gate, template-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: user_orchestrator
      display_name: "User Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  project-orchestrator:
    needs: [window-gate, user-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: project_orchestrator
      display_name: "Project Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  file-orchestrator:
    needs: [window-gate, project-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: file_orchestrator
      display_name: "File Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  help-orchestrator:
    needs: [window-gate, file-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: help_orchestrator
      display_name: "Help Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  geojson-orchestrator:
    needs: [window-gate, help-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: geojson_orchestrator
      display_name: "GeoJson Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  module-orchestrator:
    needs: [window-gate, geojson-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: module_orchestrator
      display_name: "Module Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  item-orchestrator:
    needs: [window-gate, module-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: item_orchestrator
      display_name: "Item Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  property-orchestrator:
    needs: [window-gate, item-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: property_orchestrator
      display_name: "Property Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  # Talk pages combined: 12 talk namespaces share one 10-edit budget,
  # cycling via talk_orchestrator_cursor.state. Last orchestrator in the
  # chain — the duplicate-QIDs render that follows depends on every
  # orchestrator having finished its sweep.
  talk-orchestrator:
    needs: [window-gate, property-orchestrator]
    if: always()
    uses: ./.github/workflows/ns-orchestrator-runner.yml
    with:
      module_name: talk_orchestrator
      display_name: "Talk Orchestrator"
      enable_history_offload: true
      enable_revdel: true
      enable_fandom_mirror: true
      enable_interlang_consolidate: true
      enable_wikidata_lookup: true
      edit_limit: ${{ needs.window-gate.outputs.misc-edit-limit }}
    secrets: inherit

  # Render duplicate-QIDs wiki report from the shared dict populated by
  # every orchestrator's duplicate_qids op. Must run after the last
  # orchestrator in the chain so the dict is whole-wiki, not partial.
  render-duplicate-qids:
    needs: [window-gate, talk-orchestrator]
    if: always()
    uses: ./.github/workflows/render-duplicate-qids.yml
    secrets: inherit

  # Random delay only on cron schedule, not on push.
  random-wait:
    needs: [window-gate, render-duplicate-qids]
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/random-wait.yml

  # On push: submit immediately after orchestrators
  # On cron: submit after random wait
  # Daily-fire gate keeps total wikidata edits/day bounded.
  submit-quickstatements:
    needs: [window-gate, talk-orchestrator, random-wait, cleanup]
    if: always() && needs.cleanup.result != 'cancelled' && needs.window-gate.outputs.wikidata-daily-fire == 'true'
    uses: ./.github/workflows/submit-quickstatements.yml
    secrets: inherit

  # NOTE: Wikidata is edited by EXACTLY ONE path — the daily QuickStatements
  # submission (submit-quickstatements above, with direct-daily-edits as its
  # QS-executing fallback below). No bespoke direct-API Wikidata editors. Any new
  # Wikidata work must be generated as QuickStatements lines and flow through
  # that single path. (See CLAUDE.md "Wikidata editing".) The former
  # wikidata-qualifier-edit / seed-kana-qualifier / append-kaminoyashiro-kana /
  # remove-redundant-kana-statement jobs were removed 2026-05-23 for violating
  # this rule.

  # Final action: rebuild run history page from all reports
  build-run-history:
    needs: [window-gate, submit-quickstatements]
    if: always()
    uses: ./.github/workflows/build-run-history.yml

  # Fallback: if QS submission failed, apply edits directly via Wikidata API
  # This is the absolute last step — random 1-5 min intervals, no rush.
  # Daily-fire gated so it doesn't kick off on every 6h cron.
  direct-daily-edits:
    needs: [window-gate, submit-quickstatements, build-run-history]
    if: always() && needs.submit-quickstatements.outputs.qs-failed == 'true' && needs.window-gate.outputs.wikidata-daily-fire == 'true'
    uses: ./.github/workflows/direct-daily-edits.yml
    secrets: inherit

