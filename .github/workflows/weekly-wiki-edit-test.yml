name: Weekly wiki edit-test

# Emma 2026-07-15: instead of probing the wiki hourly/daily while it's blocked,
# test a REAL edit once a week (Sunday). If the edit lands, wiki editing is enabled
# for the week; if it fails (the Cloudflare challenge blocks login, or the save
# errors), editing stays locked for the week so nothing keeps hammering the 403.
# Works -> continue; otherwise -> don't.
#
# Replaces wiki-editing-gate.yml (hourly login check) and wiki-editing-lockout.yml
# (daily 8h-contrib check) with this single weekly test. The lock/marker it writes
# are enforced by wiki_edit_allowed.py, already wired into every wiki-writing job.

on:
  schedule:
    - cron: "27 9 * * 0"   # Sundays ~09:27 UTC, off the :00 mark
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-wiki-edit-test
  cancel-in-progress: false

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}

jobs:
  edit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_USERNAME: ${{ vars.WIKI_USERNAME }}
      WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mwclient

      - name: Run the weekly edit-test (a failed test is a normal "locked" outcome, not a CI error)
        run: |
          python shinto_miraheze/weekly_wiki_edit_test.py --apply \
            || echo "edit-test failed — wiki editing locked for the week (expected while the 403 is up)"

      - name: Commit the lockout state + queue marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shinto_miraheze/wiki_editing_lockout.state queue.md
          if git diff --cached --quiet; then
            echo "no change to lockout state / marker"
          else
            git commit -m "chore: weekly wiki edit-test result [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              git fetch origin "$GITHUB_REF_NAME" || true
              git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi
