name: Wikidata drip

# Emma, 2026-09-27: "any push to main should trigger the pipeline." Nobody objects to
# this editing any more, so the old time gating (cleanup-loop's once-per-edit-day check,
# its random pre-run wait) and the conflict/enwiki gates were too aggressive. The random
# 15-20s gap BETWEEN edits stays: that noise is still wanted.
#
#   push to main   every push (commits with [skip ci], i.e. every bot commit, never trigger)
#   schedule       once a day as well, so a day with no pushes still edits
#   dispatch       by hand, or by this workflow's own retry job (with `attempt`)
#
# ORDER (Emma, same day): the drip goes FIRST, from the committed files. The 80-minute
# generation runs only after a drip that actually landed edits, so a blocked day costs
# minutes, not hours. cleanup-loop still regenerates the files once a day as well.
#
# FAIL FAST + RETRY: since 09-21 most runs landed nothing (every write failed for the
# whole run). direct_daily_edits.py stops when its first 10 attempted edits all fail and
# reports blocked=true. The retry job then waits 15 minutes and dispatches this workflow
# again: a new job gets a new VM, and usually a new IP. Up to 12 more attempts.
#
# Each run does up to 1,000 edits. One run at a time: a push during a run waits and starts
# after it; GitHub keeps only the newest waiting run. The Wikidata lockout state file
# still gates every write.

# ⛔ OFF since 2026-09-28 (Emma): no automated Wikidata edits. Everything goes through
# QuickStatements by hand from the site's home page. No push or schedule trigger; the
# lockout state file also refuses every write if this is dispatched.
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "Retry attempt number (set by the retry job; leave empty)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: wikidata-drip
  cancel-in-progress: false

jobs:
  direct-daily-edits:
    uses: ./.github/workflows/direct-daily-edits.yml
    secrets: inherit

  # Only after a drip that landed edits.
  generate-quickstatements:
    needs: [direct-daily-edits]
    if: ${{ !cancelled() && needs.direct-daily-edits.outputs.landed != '' && needs.direct-daily-edits.outputs.landed != '0' }}
    uses: ./.github/workflows/generate-quickstatements.yml
    secrets: inherit

  # Blocked: try again on a fresh runner every 15 minutes, up to attempt 13 (the
  # original + 12 retries; Emma 2026-09-27, after four 5-minute retries in a row were blocked).
  retry-on-fresh-runner:
    needs: [direct-daily-edits]
    if: ${{ always() && needs.direct-daily-edits.outputs.blocked == 'true' && fromJSON(inputs.attempt || '1') < 13 }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then re-dispatch the drip on a new runner
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
        run: |
          NEXT=$((ATTEMPT + 1))   # arithmetic in the shell: GitHub expressions have none
          echo "Blocked on attempt $ATTEMPT; retrying as attempt $NEXT in 15 minutes."
          sleep 900
          gh workflow run wikidata-drip.yml --repo "$GITHUB_REPOSITORY" --ref main -f attempt="$NEXT"
