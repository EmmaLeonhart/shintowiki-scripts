name: Substitute Source Shrine proposal (one-shot)

# ONE-SHOT date-gated Wikidata talk-page edit (Emma 2026-06-16).
# substitute_source_shrine_proposal.py is a no-op until 2026-09-04 (80 days out),
# then subst's the finished {{Wikidata:Property proposal/Source Shrine}} into
# [[Wikidata talk:WikiProject Shinto]] exactly once and is idempotent thereafter.
# Scheduled daily through September so it fires promptly on the gate date and
# self-heals if a run fails; safe to delete this workflow + script once the edit
# has landed.

on:
  workflow_dispatch:
  schedule:
    # Every day in September (UTC). Date gate inside the script enforces 2026-09-04.
    - cron: "17 9 * 9 *"

permissions:
  contents: read

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  substitute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # ⛔ WIKIDATA LOCKOUT GUARD. Single source of truth:
      # shinto_miraheze/wikidata_editing_lockout.state (Emma 2026-08-18 — no Wikidata
      # editing for a month, through 2026-09-17). No date is duplicated here; the guard
      # exits 1 while locked. The script below ALSO checks it in code, so this step is
      # belt-and-braces — it just stops the run before it even logs in, and makes the
      # skip visible in the run log rather than buried in the script's stdout.
      - name: Wikidata lockout guard
        id: wikidata_lockout
        run: |
          if python3 shinto_miraheze/wikidata_edit_allowed.py; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wikidata lockout::LOCKED — skipping all Wikidata writes."
          fi

      - name: Substitute finished proposal
        if: steps.wikidata_lockout.outputs.open == 'true'
        working-directory: modern-quickstatements
        env:
          MW_BOTNAME: ${{ secrets.MW_BOTNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python substitute_source_shrine_proposal.py --apply --run-tag "[[github:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|substitute-source-shrine-proposal]]"
