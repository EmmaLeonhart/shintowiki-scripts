name: Generate QuickStatements

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch P11250 from wiki
        working-directory: modern-quickstatements
        run: python fetch_p11250_from_wiki.py
        # Miraheze has anti-DDoS 403'd the runner since ~2026-07-11
        # (docs/wiki_403_audit_2026-07-11.md). This is a MIRAHEZE fetch; Wikidata
        # is a different service and must not die with it. Hard-failing here killed
        # generate-quickstatements, which killed cleanup-loop, which never called
        # direct-daily-edits — so the Wikidata drip has made no edit since
        # 2026-07-02. On failure the committed .txt stays as the fallback, exactly
        # as generate-pages.yml already does for its artifacts.
        continue-on-error: true

      - name: Fetch P6262 from wiki
        working-directory: modern-quickstatements
        run: python fetch_p6262_from_wiki.py
        continue-on-error: true

      - name: Fetch en-labels from wiki
        working-directory: modern-quickstatements
        run: python fetch_en_labels_from_wiki.py
        continue-on-error: true

      - name: Fetch category-label-prefix fixes from wiki
        working-directory: modern-quickstatements
        run: python fetch_category_label_fixes_from_wiki.py
        continue-on-error: true

      - name: Resolve + generate 同上 address fixes
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          python resolve_doujou_addresses.py
          python generate_doujou_address_fixes.py

      - name: Generate address citation backfill (non-同上 imported addresses)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_address_citation_backfill.py

      - name: Generate shrine ranking QS
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_modern_shrine_ranking_qualifiers.py

      - name: Remove Old Japanese official names from Shikinai Ronsha candidates
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_ronsha_ojp_name_removals.py

      - name: Cite Shikinaisha P31 statements to the Kokugakuin database
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shikinaisha_kokugakuin_refs.py

      - name: Remove uncited Japanese addresses where a cited one exists
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_uncited_address_removals.py

      - name: Generate P958 QS
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 10
          python generate_p958_qualifiers.py

      - name: Drip-feed 20 label proposals from the label-generator subtree
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python select_label_proposals.py

      - name: Generate kana-qualifier ADD QuickStatements (カミノヤシロ)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kana_qualifier_add.py

      - name: Generate kana-qualifier REMOVE QuickStatements (SPARQL-gated)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_kana_qualifier_remove.py

      - name: Generate Reisai (例祭) QS from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_reisai_quickstatements.py

      - name: Saijin (祭神) P825 deities from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_saijin_quickstatements.py

      - name: Honzon (本尊) P825 from jawiki temples (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_honzon_quickstatements.py

      - name: Souken (創建) P571 founding dates from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_souken_quickstatements.py

      - name: Kofun shapes + periods from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kofun_quickstatements.py

      - name: Bunrei qualifier repair (bare P612 -> +P1013 Bunrei, self-healing)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_bunrei_qualifier_repair.py

      - name: Reisai qualifier repair (bare P837 -> +P3831 Reisai, self-healing)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_reisai_qualifier_repair.py

      - name: Scholar ID (P1960) for Q140568870 — date-gated to 2026-07-29
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_scholar_id.py

      # The two description generators are SPARQL-heavy (~30-40 min each) and
      # their data barely drifts daily (both self-drain via skip-if-standard on
      # regeneration), so they refresh weekly on Sundays — the daily job stays
      # inside its timeout.
      - name: Description fixes (desc-without-label pairs, weekly Sunday refresh)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python generate_description_fixes.py; \
          else echo "not Sunday — keeping committed description_label_pairs.txt"; fi

      - name: Description adds (labeled items missing descriptions, weekly Sunday refresh)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ]; then python generate_description_adds.py; \
          else echo "not Sunday — keeping committed description_adds.txt"; fi

      - name: Commit generated files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd modern-quickstatements
          # Save generated files before any git operations
          mkdir -p /tmp/qs_backup
          cp *.txt /tmp/qs_backup/ 2>/dev/null || true
          cp -r _site/ /tmp/qs_backup/_site/ 2>/dev/null || true
          # Stage ALL .txt files (including empty ones that replaced old content)
          git add *.txt 2>/dev/null || true
          git add _site/ 2>/dev/null || true
          cd ..
          git diff --cached --quiet && echo "No generated file changes to commit" || {
            # Reset index and working tree, pull latest, then re-apply generated files
            git reset HEAD -- . || true
            git checkout -- . || true
            git clean -fd modern-quickstatements/ || true
            git pull --rebase || true
            cp /tmp/qs_backup/*.txt modern-quickstatements/ 2>/dev/null || true
            cp -r /tmp/qs_backup/_site/* modern-quickstatements/_site/ 2>/dev/null || true
            cd modern-quickstatements
            git add *.txt 2>/dev/null || true
            git add _site/ 2>/dev/null || true
            cd ..
            git diff --cached --quiet && echo "No changes after rebase" || {
              git commit -m "chore(qs): update generated QuickStatements files [skip ci]"
              # Retry push once after pulling if it gets rejected again
              git push || { git pull --rebase && git push; }
            }
          }

      - name: Upload generated QS files
        uses: actions/upload-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements/*.txt
          retention-days: 1

      - name: Upload generated QS site
        uses: actions/upload-artifact@v5
        with:
          name: quickstatements-site
          path: modern-quickstatements/_site/
          retention-days: 1
