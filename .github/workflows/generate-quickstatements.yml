name: Generate QuickStatements

on:
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Run the weekly (Sunday-gated) description generators regardless of the day"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: write

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # timeout-minutes 150. Kept, but NOT for the reason it was raised.
    #
    # ⚠ THE WHOLE TIMEOUT STORY WAS WRONG, and a forced run on 2026-08-24 disproved it:
    # the full path INCLUDING both weekly steps finished in 41.8 minutes. There is no
    # Sunday overrun to accommodate.
    #
    # What actually happened, corrected in order:
    #   * Both Sunday cancellations (08-16, 08-23) died at 75m14s under the OLD 75.
    #     I claimed the raise to 150 was live for the second one; it landed at
    #     2026-08-23T10:15Z, seven hours after that run began, and I had compared a
    #     local timestamp (03:15-07:00) against a UTC one.
    #   * The weekly generators are not "~30-40 min each". Forced, they took 80s and 161s.
    #   * They have never been running out of time. They BAIL ON HTTP 429 from WDQS and
    #     `continue-on-error: true` reports the step GREEN, so the job succeeds while the
    #     file silently does not regenerate. That is why description_label_pairs.txt has
    #     not moved since 2026-08-02 with three Sundays in between and nothing ever
    #     looking wrong.
    #
    # So the Sunday cancellations and the stale file were two unrelated faults that
    # looked like one story. The timeout stays at 150 because the earlier 75 genuinely
    # was too tight for the whole job on a bad day — not because this path needs it.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Lockout guard (Emma 2026-07-27). This workflow is workflow_call-only, so
      # it never showed up in the "scheduled + unguarded" audit — but cleanup-loop
      # calls it daily and the four Miraheze fetches below were its single largest
      # remaining source of traffic to the 403'd wiki (~27 min/run). Emma's read:
      # continuing to read through the block is likely what kept us looking
      # persistent, so a locked wiki now means ZERO requests, not just zero writes.
      # Only the Miraheze fetches are gated — every generator below is Wikidata /
      # SPARQL and must keep running, since the Wikidata drip is a separate service.
      - name: Wiki-editing lockout guard
        id: lockout
        run: |
          if python3 shinto_miraheze/wiki_edit_allowed.py; then
            echo "locked=false" >> "$GITHUB_OUTPUT"
          else
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki-editing lockout::Wiki editing is locked — skipping the four Miraheze fetches; committed .txt files stay as the fallback."
          fi

      - name: Fetch P11250 from wiki
        if: steps.lockout.outputs.locked != 'true'
        working-directory: modern-quickstatements
        run: python fetch_p11250_from_wiki.py
        # Miraheze has anti-DDoS 403'd the runner since ~2026-07-11
        # (docs/wiki_403_audit_2026-07-11.md). This is a MIRAHEZE fetch; Wikidata
        # is a different service and must not die with it. Hard-failing here killed
        # generate-quickstatements, which killed cleanup-loop, which never called
        # direct-daily-edits — so the Wikidata drip has made no edit since
        # 2026-07-02. On failure the committed .txt stays as the fallback, exactly
        # as generate-pages.yml already does for its artifacts.
        continue-on-error: true

      - name: Fetch P6262 from wiki
        if: steps.lockout.outputs.locked != 'true'
        working-directory: modern-quickstatements
        run: python fetch_p6262_from_wiki.py
        continue-on-error: true

      - name: Fetch en-labels from wiki
        if: steps.lockout.outputs.locked != 'true'
        working-directory: modern-quickstatements
        run: python fetch_en_labels_from_wiki.py
        continue-on-error: true

      - name: Fetch category-label-prefix fixes from wiki
        if: steps.lockout.outputs.locked != 'true'
        working-directory: modern-quickstatements
        run: python fetch_category_label_fixes_from_wiki.py
        continue-on-error: true

      - name: Resolve + generate 同上 address fixes
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          python resolve_doujou_addresses.py
          python generate_doujou_address_fixes.py

      - name: Generate address citation backfill (non-同上 imported addresses)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_address_citation_backfill.py

      - name: Generate shrine ranking QS
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_modern_shrine_ranking_qualifiers.py

      - name: Remove Old Japanese official names from Shikinai Ronsha candidates
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_ronsha_ojp_name_removals.py

      - name: Cite Shikinaisha P31 statements to the Kokugakuin database
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shikinaisha_kokugakuin_refs.py

      - name: Remove uncited Japanese addresses where a cited one exists
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_uncited_address_removals.py

      - name: Generate P958 QS
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 10
          python generate_p958_qualifiers.py

      # The sections generate_p958_qualifiers.py can never reach: it is add-only, so a
      # section that is PRESENT but wrong is invisible to it forever. Self-healing — it
      # re-reads live state each build, so a correction that has landed emits nothing.
      # Two outputs: p958_corrections.txt (sections merely MISSING; atomic, registered)
      # and an append to sequential_misc.txt (sections WRONG; a remove-then-rebuild pair
      # that only the sequential cursor can run in the right order). The append dedups
      # against what is already in that file.
      - name: Correct wrong and missing P958 sections
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_p958_corrections.py

      # The English-label residual is blocked on READINGS, not on the romanization rule:
      # generate_kana_en_labels.py turns kana into a label with no judgement and has nothing
      # to turn. This supplies them from the National Tax Agency registry — a 宗教法人's
      # legally registered フリガナ, the source 4,764 existing P1814 statements already cite.
      # Self-healing: it re-queries for items that STILL have no P1814, so a landed reading
      # drops out. The registry index is refreshed separately (it is a ~240MB download and
      # the registry republishes monthly); this step reads whatever index is committed.
      - name: Kana from the National Tax Agency registry
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_nta_kana.py

      - name: Drip-feed 20 label proposals from the label-generator subtree
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python select_label_proposals.py

      # 天神社 English labels from each item's own reading — a deliberate special case;
      # see the ATOMIC_FILES note in direct_daily_edits.py for why it is not a fix to
      # kana_english.label_for. Re-runs every build so a corrected reading moves the label.
      # Collapsed `part of` statements — see the ATOMIC_FILES note in direct_daily_edits.py.
      - name: Generate multi-ordinal part-of removals
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_multi_ordinal_removals.py

      # The same P361 defect as list_membership_removals.txt, in the 816 items that file's
      # ronsha-based selection never reached. Self-healing: it re-checks what is already
      # staged there each build, so it shrinks to nothing as the drip delivers.
      # Script 1 of the membership pair: the LIST item is the source of truth, so for every
      # item it names as a part, emit one clean `part of` with the ordinal, follows/followed-by
      # and both references. ADD-only and diffed against live state, so it SHRINKS as it lands.
      # That shrinking is the whole design and it only works if this runs — it was registered in
      # ATOMIC_FILES but in no workflow, so list_membership_rebuild.txt sat frozen from
      # 2026-07-10 while being staged for delivery.

      # ⛔ WIRED 2026-08-25. Every one of these was registered in ATOMIC_FILES — staged for
      # delivery — while running in NO workflow, so its output sat frozen between 2026-07-06
      # and 2026-08-04 and would have delivered six-week-old content when the lockout lifts.
      # Emma: "Github actions should be updating these things periodically that's the entire
      # point of this repo and how it works." A generator that is staged but unscheduled is a
      # defect by design, not an oversight to note.
      - name: Bunrei (分霊) P612 + qualifiers
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_bunrei_quickstatements.py
      - name: P3225 corporate numbers
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_p3225_quickstatements.py
      - name: Hisousha P119/P547
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_hisousha_quickstatements.py
      - name: Province exclusions
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_province_exclusions.py
      - name: List-membership removals (script 2 of the pair)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_list_membership_removals.py
      - name: Miscellaneous edits
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_miscellaneous_edits.py
      - name: Sangō (山号) P1448
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_sango_quickstatements.py
      - name: Shintai (神体) P825
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shintai_quickstatements.py
      - name: Sōken-den (創建伝) P571
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_souken_den_quickstatements.py
      - name: Kami parent qualifiers
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kami_parent_qualifiers.py
      - name: Shinto honorifics (stage 1)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shinto_honorifics.py
      - name: Shinto short names (stage 2)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shinto_short_names.py
      - name: Genbu ids
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_genbu_ids.py
      - name: Shinmei ids
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shinmei_ids.py
      - name: Jinjacho P973
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_jinjacho_p973.py
      - name: Saijin deity research
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_saijin_deity_research.py
      - name: Rebuild list membership from the list items
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_list_membership_rebuild.py

      - name: Generate orphan membership removals
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_orphan_membership_removals.py


      - name: Generate 天神社 English labels from their readings
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_tenjinsha_en_labels.py

      - name: Generate kana-qualifier ADD QuickStatements (カミノヤシロ)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kana_qualifier_add.py

      - name: Generate kana-qualifier REMOVE QuickStatements (SPARQL-gated)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_kana_qualifier_remove.py

      # Brings the three 2026-09-10 lost-shrine items level with the three Emma
      # created by hand on 2026-09-06. Emma merges the duplicates herself in her own
      # time; ours is parity, so whichever survives is complete. The only gap is
      # P625, which the create run could not encode. Self-healing: empty once the
      # three coordinates land.
      - name: Generate lost-shrine twin-parity QuickStatements
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_lost_shrine_parity.py

      # The residue the カミノヤシロ pipeline cannot reach: top-level katakana P1814
      # on items with no ojp-hani P1448 of their own and no Engishiki entry item
      # one P460/P361 hop away. The hiragana is DERIVED from the English label
      # (docs/script-rationale/katakana_name_in_kana_2026-09.md). Add-first, then a SEPARATE remove
      # that only fires where a fresh SPARQL confirms the add has landed.
      - name: Generate derived-hiragana P1814 ADD QuickStatements
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_katakana_reading_add.py

      # Cite existing unreferenced P6375 addresses to the subject's OWN jawiki
      # article, where that article states the same address. The sibling backfill
      # works from the 式内社一覧 tables and reaches 139; this reaches 2,728.
      - name: Address citations from the subject's own article
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_address_citation_from_article.py

      # Model CONFORMANCE — "of the statements that exist, how many carry the full
      # modelled shape". This audit already existed and was wired into NOTHING,
      # which is why the reference and qualifier gaps it measures were found by a
      # one-off survey on 2026-09-11 rather than reported. Weekly: it is a survey,
      # not a generator, and its numbers move slowly.
      - name: Audit model adoption (conformance of existing statements)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.force_weekly }}" = "true" ]; then             python audit_model_adoption.py --json ../docs/model_adoption.json               || echo "::warning title=Audit did not run::audit_model_adoption.py exited non-zero — read the traceback above; do NOT assume WDQS.";           else echo "not Sunday and not forced — skipping the conformance audit"; fi

      # The katakana P1814 values neither pipeline can reach, categorised for a
      # per-category ruling ([[Open questions]], 2026-09-11). Report only.
      - name: Report stuck katakana readings
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python report_stuck_katakana_readings.py

      # Clears every description off the items named in the generator's TARGETS.
      # Emma hit Wikidata's anti-abuse limiter removing 41 by hand from Q11558526
      # and asked for the pipeline to do it. Self-healing: zero lines once clean.
      - name: Generate description removals for named items
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_description_removals.py

      # The GENERAL case of the same derivation: every shrine with a ja label, an
      # en label and no P1814 at all. Tiered against a held-out measurement (the
      # shrines that carry BOTH an en label and a real reading) -- ships where the
      # derivation agrees with the item's name-mates and where no name-mate reading
      # exists, holds the ~1,350 where they contradict. Emma's call, 2026-09-10.
      # Add-only, self-healing: the file shrinks as the drip delivers.
      - name: Generate derived P1814 for en-labelled shrines (general case)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_derived_name_in_kana.py

      # ...and the held tier, routed to the LLM work-queue so a jawiki lead breaks
      # the tie. Bounded per run; the queue is meant to stay non-empty.
      - name: Queue the disputed kana readings for the LLM
        continue-on-error: true
        run: python shinto_miraheze/build_kana_disagreement_queue.py --limit 150

      - name: Generate katakana P1814 REMOVE QuickStatements (SPARQL-gated)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          sleep 5
          python generate_katakana_reading_remove.py

      # Restores the four ojp-hani official names the REMOVE step above destroyed
      # before its sibling-qualifier half was stopped (2026-09-09). Self-healing:
      # writes 0 lines once all four are whole again.
      - name: Generate ojp-hani official-name restores
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_ojp_name_restores.py

      # Must run AFTER label_typo_fixes.txt is up to date — it reads that file to
      # learn which English name changed, then rewrites the fr/id/de/tr labels
      # built on the old one. Self-healing: it skips any item whose en label has
      # already been corrected on Wikidata, since the old name is then unknown.
      - name: Propagate corrected EN labels into the other languages
        continue-on-error: true
        run: python shinto_miraheze/generate_multilingual_label_fixes.py

      # A rule, not a queue: French elision needs no per-item judgement, so it
      # generates its QuickStatements directly. One WDQS query, filtered
      # server-side. Regenerated each run so a "de Ōmi…" introduced by any future
      # label pass is caught on the next fire.
      - name: Generate French elision fixes (sanctuaire de X -> d’X)
        continue-on-error: true
        run: python shinto_miraheze/generate_french_elision_fixes.py

      - name: Generate Reisai (例祭) QS from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_reisai_quickstatements.py

      - name: Saijin (祭神) P825 deities from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_saijin_quickstatements.py

      - name: Honzon (本尊) P825 from jawiki temples (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_honzon_quickstatements.py

      # Removals for P825 values that are Cultural-Property-of-Japan designations
      # rather than deities. Runs right after the honzon generator because that is
      # what produces them: it takes every wikilink in the jawiki 本尊 field, and
      # the infoboxes write |本尊 = [[阿弥陀如来]]（[[重要文化財]]）.
      # This MUST regenerate — its whole design is to re-derive from live Wikidata
      # so the batch empties and goes inert once the statements are gone. Left
      # unwired it is a frozen snapshot that never drains and never sees new ones.
      - name: Invalid P825 designation removals (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_invalid_p825_removals.py

      # Step 2 of the honzon image-form relocation. Emits nothing until the P3831
      # qualifiers from the honzon generator above have landed, and that ordering
      # is enforced by its SPARQL, not by step order here.
      - name: Misplaced honzon form removals (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_misplaced_form_removals.py

      # P2868 role qualifiers onto EXISTING P460 statements on pure Shikinai
      # Ronsha. Also must regenerate: it skips statements that already carry the
      # qualifier, so a static file would keep re-emitting work already done and
      # would never pick up ronsha created since.
      - name: Ronsha P2868 role qualifiers (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_ronsha_role_qualifiers.py

      - name: Souken (創建) P571 founding dates from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_souken_quickstatements.py

      - name: Kofun shapes + periods from jawiki (regenerate each run)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kofun_quickstatements.py

      - name: Bunrei qualifier repair (bare P612 -> +P1013 Bunrei, self-healing)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_bunrei_qualifier_repair.py

      - name: Reisai qualifier repair (bare P837 -> +P3831 Reisai, self-healing)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_reisai_qualifier_repair.py

      # Wired in 2026-07-28: the wire-in condition was "all 42 ja.wp per-rank
      # categories resolve once WDQS has indexed the 26 sub-rank items", and a
      # live rerun that day reported "42 rank categories resolved". Add-only,
      # and existing person->rank pairs are preloaded from WDQS and skipped, so
      # regeneration shrinks the file as it drains.
      - name: Court rank (P14005) on people from the ja.wp 位階受位者 tree
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_court_rank_quickstatements.py

      # ⚠ MEASURED 2026-08-24 by a forced run, and the premise below was wrong twice.
      # They are NOT "~30-40 min each": forced, they took 80s and 161s. And they have
      # not been running out of time — they BAIL ON HTTP 429 from WDQS, and
      # `continue-on-error: true` then reports the step GREEN. So the job succeeds, the
      # file silently does not regenerate, and description_label_pairs.txt has not moved
      # since 2026-08-02 while three Sundays passed and nothing ever looked wrong.
      #
      # The bail is correct — 429 means back off, and the standing policy is to stop
      # rather than retry. What was wrong is that a bail and a refresh looked identical
      # from outside. The `|| echo ::warning` makes a skipped refresh an annotation on
      # the run instead of nothing at all. continue-on-error stays: a rate-limited
      # weekly refresh must not fail the daily job.
      #
      # Original rationale, kept because the weekly cadence itself is still deliberate:
      # both generators self-drain via skip-if-standard on regeneration, so their data
      # barely drifts day to day.
      # ⛔ THESE WARNINGS USED TO NAME A CAUSE, AND THE CAUSE WAS WRONG.
      # They said "bailed (usually HTTP 429 from WDQS)". On 2026-09-13
      # generate_description_adds.py was dying at IMPORT —
      #   ImportError: cannot import name 'pref_labels' from 'generate_description_fixes'
      # — after 47b42aff deleted that helper from the label-only sibling on 09-11.
      # A deterministic two-line fix, reported as a rate limit for two weekly slots,
      # while description_adds.txt went on dripping its 2026-08-25 content. Say the
      # step failed and point at the traceback; the run log already has the answer.
      - name: Description fixes (desc-without-label pairs, weekly Sunday refresh)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.force_weekly }}" = "true" ]; then \
            python generate_description_fixes.py \
              || echo "::warning title=Weekly refresh did not run::generate_description_fixes.py exited non-zero — read the traceback above; do NOT assume WDQS. description_label_pairs.txt was NOT regenerated."; \
          else echo "not Sunday and not forced — keeping description_label_pairs.txt"; fi

      - name: Description adds (labeled items missing descriptions, weekly Sunday refresh)
        working-directory: modern-quickstatements
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.force_weekly }}" = "true" ]; then \
            python generate_description_adds.py \
              || echo "::warning title=Weekly refresh did not run::generate_description_adds.py exited non-zero — read the traceback above; do NOT assume WDQS. description_adds.txt was NOT regenerated."; \
          else echo "not Sunday and not forced — keeping description_adds.txt"; fi

      # MUST be the last step before the commit. The husks are items ブルーノ・プラス
      # repurposed (queue.md A5); each one now IS the shrine item a sitelink lookup
      # resolves to, so generators re-emit lines targeting them on every run — A5
      # says to expect exactly that. Stripping here keeps the staged files clean at
      # one chokepoint instead of filtering in twenty generators. The submitter's
      # item_is_editable() refusal is still the load-bearing gate; this is what
      # keeps tests/test_repurposed_husks_never_edited.py green.
      # NOT continue-on-error: if this cannot run, husk lines stay staged.
      # ── builder → cloud routine → collector pipelines ────────────────────
      # Emma, 2026-09-12, asked whether these should run automatically:
      # "Wire them all into CI."
      #
      # Before this, ONE of the seven was wired end to end (category
      # translation). The rest depended on somebody running the collector by
      # hand, so answers the routine had already produced sat in work-files —
      # 10 of them were stranded on the day this was found, and the empty
      # name_in_kana.txt had been misread as the routine being slow.
      #
      # ORDER MATTERS: collect first, then build. A collector consumes answers
      # and deletes the work-file; a builder tops the queue back up. The other
      # way round, a builder can recreate a file the collector is about to eat.
      #
      # NOT gated on the shinto.miraheze lockout. These touch local files and
      # Wikidata only — the existing category-translation collector in
      # wiki-cleanup.yml IS gated on it, which means that one silently stops
      # whenever the wiki is locked, as it is now. Do not copy that here.
      - name: "Collect: cloud answers into atomic files"
        continue-on-error: true
        run: |
          for c in collect_name_in_kana collect_ronsha_rankings collect_beppyo_p612                    collect_label_typo_answers collect_description_enrichment collect_en_labels; do
            echo "--- $c"
            python3 "shinto_miraheze/$c.py" || echo "$c non-fatal"
          done

      # Reports cloud-fed stages whose output has stopped growing while work is
      # still queued -- the shape of the 52-day Stage 4 gap, whose driver lived
      # outside this repo and so was invisible to every test in it. Prints GH
      # ::warning:: annotations so the finding lands on the run, not in a log.
      # Always exits 0 on purpose: a quiet cloud routine must not stop the
      # pipeline. continue-on-error too, so it cannot break the job either way.
      - name: "Check: cloud-fed stages still have a driver"
        continue-on-error: true
        run: python3 shinto_miraheze/check_stage_liveness.py

      - name: "Build: refill the cloud work queues"
        continue-on-error: true
        run: |
          for b in build_name_in_kana_queue build_ronsha_ranking_queue build_beppyo_p612_queue                    build_label_typo_review_queue build_description_enrichment_queue build_en_label_queue; do
            echo "--- $b"
            python3 "shinto_miraheze/$b.py" || echo "$b non-fatal"
          done

      # Separate commit: the collectors DELETE consumed work-files in
      # repo-root directories, which the generated-.txt commit below does not
      # stage — it only looks inside modern-quickstatements.
      # ⛔ TWO THINGS HERE WERE WRONG ON THE FIRST RUN (2026-09-13) AND BOTH
      # MATTER MORE THAN THEY LOOK.
      #
      # 1. No `git config user.*`. `git commit` died with "Author identity
      #    unknown", `continue-on-error: true` painted the step green, and the
      #    staged changes were left in the index for the NEXT commit step to trip
      #    over. A commit step that cannot commit is worse than no commit step:
      #    it fails silently and hands the mess downstream.
      # 2. It staged `modern-quickstatements/*.txt`, which is exactly the set the
      #    "Commit generated files to repo" step below owns and handles with a
      #    backup / reset / clean / rebase / restore dance. Two steps committing
      #    the same files in one job is a race by construction.
      #
      # So this stages ONLY the work-file directories — the thing the step below
      # does not cover, because it only ever looks inside modern-quickstatements.
      - name: "Commit: collected answers + refreshed work queues"
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add name_in_kana/ ronsha_ranking_review/ beppyo_p612/                   label_typo_review/ description_enrichment_en/ en_label/ 2>/dev/null || true
          # ⛔ docs/model_adoption.json HAD NEVER ONCE BEEN COMMITTED. The Sunday
          # conformance audit writes it (step "Audit model adoption", ../docs/ from
          # modern-quickstatements) and nothing staged `docs/` — the step below only
          # ever looks inside modern-quickstatements — so every Sunday the runner
          # computed the whole model-adoption picture and threw it away. Checked
          # 2026-09-14: zero commits to that path in the repo's history, and it is
          # not gitignored. It is the answer to Emma's *"how much model conformity
          # does wikidata have with our ontology?"*, and the only adoption data in
          # the repo was a 2026-07-28 file and a hand-made 09-12 snapshot.
          #
          # Staged HERE rather than in the generated-files step, deliberately: that
          # one does a reset / checkout / clean / rebase / restore dance scoped to
          # modern-quickstatements, and an unstaged docs/ file would be destroyed by
          # its `git checkout -- .` before ever being added. This step has no dance.
          #
          # One file, overwritten each Sunday — not an accumulating archive, so it
          # does not fall foul of "reports expire after a week"; git history then
          # gives the conformity TREND for free, which is what the hand-made snapshot
          # was created to provide.
          git add docs/model_adoption.json 2>/dev/null || true
          # ⛔ SAME BUG, SECOND FILE. `report_stuck_katakana_readings.py` runs DAILY
          # (step "Report stuck katakana readings") and writes
          # docs/stuck_katakana_readings.md. That file IS tracked, so the discard was
          # visible all along as `M docs/stuck_katakana_readings.md` in the
          # "Unstaged changes after reset" list of every run — CI regenerated it and
          # the generated-files step's `git checkout -- .` put it straight back.
          # Last real commit to it: 2026-09-11, by hand.
          #
          # It is a BURN-DOWN. Its own header says "the numbers should fall on their
          # own; a category that stops shrinking is the thing to look at" — which is
          # unreadable if the regenerated file never lands. wiki-cleanup.yml already
          # names docs/category_translation_residual.md explicitly for this reason,
          # so the pattern was understood; this workflow just never applied it.
          git add docs/stuck_katakana_readings.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No collected answers or queue changes to commit."
          else
            git commit -m "chore(cloud-queue): collect answers + refill work queues + conformance audit [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && echo "pushed." || echo "WARNING: push failed."
          fi

      - name: Strip QuickStatements targeting repurposed husks
        working-directory: modern-quickstatements
        run: python strip_husk_lines.py --apply

      - name: Commit generated files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd modern-quickstatements
          # Save ONLY the files THIS RUN actually changed.
          #
          # This used to be `cp *.txt`, which backed up every .txt in the
          # directory — including ones no step here regenerates — and then copied
          # the whole lot back after `git pull --rebase`, silently reverting
          # anything anyone else had pushed in between. Observed 2026-08-04:
          # afeabab9 restored a jinjacho_p973.txt built from a 1,151-row CSV on
          # top of a pulled 1,441-row CSV, dropping 205 real matched pairs out of
          # the drip while leaving the repo internally consistent-looking.
          #
          # "What this run changed" is asked ONCE, with `git status --porcelain`,
          # and that single command is load-bearing. It was two commands until
          # 2026-09-13 — `git diff --name-only` plus `git ls-files --others` — and
          # that pair got the list wrong twice, each time by silently omitting
          # files and each time discarding a whole run's regeneration of them:
          #
          #   * The two disagreed about path format when run from a subdirectory
          #     (diff prints repo-root-relative, ls-files prints CWD-relative), so
          #     the `sed` prefix-strip dropped every BRAND-NEW file. Patched
          #     2026-09-12 with --full-name. `souken_p571_citations.txt` and
          #     `saijin_named_as.txt` had never been able to enter the repo.
          #   * `git diff` compares the worktree against the INDEX, not HEAD. The
          #     step above staged `modern-quickstatements/*.txt` and then failed to
          #     commit (no git identity), so on 2026-09-13 about thirty modified
          #     files were staged, therefore invisible to `git diff`, therefore not
          #     backed up — and the `git clean -fd` / `git checkout -- .` below
          #     reverted every one of them to HEAD. 17 P825 removal lines went back
          #     to 16 and 497 ronsha qualifiers back to 502 with nothing in the log
          #     saying so.
          #
          # `git status --porcelain` reports staged, unstaged and untracked in one
          # root-relative format, so neither mistake is expressible. It is run from
          # $GITHUB_WORKSPACE for that root-relative guarantee; --untracked-files=all
          # lists files inside a new directory individually rather than the
          # directory. The narrowness is still the point: a file no step here
          # touched is not listed, so the rebase's version of it survives.
          mkdir -p /tmp/qs_backup
          git -C "$GITHUB_WORKSPACE" -c core.quotePath=false status --porcelain --untracked-files=all -- modern-quickstatements > /tmp/qs_status.txt
          cut -c4- /tmp/qs_status.txt | sed -n 's|^modern-quickstatements/||p' | sort -u > /tmp/qs_files.txt
          echo "this run changed $(wc -l < /tmp/qs_files.txt) file(s):"; cat /tmp/qs_files.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "/tmp/qs_backup/$(dirname "$f")"
            cp "$f" "/tmp/qs_backup/$f"
          done < /tmp/qs_files.txt
          # Stage ALL .txt files (including empty ones that replaced old content)
          git add *.txt 2>/dev/null || true
          git add _site/ 2>/dev/null || true
          cd ..
          git diff --cached --quiet && echo "No generated file changes to commit" || {
            # Reset index and working tree, pull latest, then re-apply generated files
            git reset HEAD -- . || true
            git checkout -- . || true
            git clean -fd modern-quickstatements/ || true
            git pull --rebase || true
            # Restore ONLY this run's own output. Files the rebase brought in
            # newer are left exactly as pulled — that is the whole point.
            while IFS= read -r f; do
              [ -f "/tmp/qs_backup/$f" ] || continue
              mkdir -p "modern-quickstatements/$(dirname "$f")"
              cp "/tmp/qs_backup/$f" "modern-quickstatements/$f"
            done < /tmp/qs_files.txt
            cd modern-quickstatements
            git add *.txt 2>/dev/null || true
            git add _site/ 2>/dev/null || true
            cd ..
            git diff --cached --quiet && echo "No changes after rebase" || {
              git commit -m "chore(qs): update generated QuickStatements files [skip ci]"
              # Retry push once after pulling if it gets rejected again.
              # --autostash is load-bearing: on 2026-09-13 GitHub rejected the
              # push with "remote: fatal error in commit_refs" — a server-side
              # transient — and the retry then died on "cannot pull with rebase:
              # You have unstaged changes", losing the whole commit. The tree is
              # never clean here; _site/ and the json reports are still dirty.
              git push || { git pull --rebase --autostash && git push; }
            }
          }

      - name: Upload generated QS files
        uses: actions/upload-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements/*.txt
          retention-days: 1

      - name: Upload generated QS site
        uses: actions/upload-artifact@v5
        with:
          name: quickstatements-site
          path: modern-quickstatements/_site/
          retention-days: 1
