name: Tests

# Runs the pytest suite so regressions are caught in CI — notably the
# 2026-06-07 git-synced clobber fix (sync_revision_aware.resolve_conflict),
# which previously had zero tests. Paths-filtered to code changes so the
# orchestrator/state-commit churn ([skip ci]) doesn't trigger it.
#
# `tests/**.py` is in the filter as of 2026-08-27 because it was NOT, and a
# test-only commit therefore ran no tests at all: b58dd81f added a new test file
# plus four workflow YAMLs and got no CI run. Every green run before that was on a
# commit that happened to also touch a source tree, so the suite looked gated when
# it was not.
#
# `.github/workflows/**` is here for the mirror-image reason —
# tests/test_miraheze_writers_are_lockout_gated.py READS the workflow tree, so a
# workflow edit changes that test's input. Without this entry the test guarding the
# wiki lockout would never run on the files it guards.
on:
  push:
    paths:
      - "shinto_miraheze/**.py"
      - "modern-quickstatements/**.py"
      - "shinto-label-generator/**.py"
      - "recreate-deleted-wikidata/**.py"
      - "jinjacho/**.py"
      - "tests/**.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "shinto_miraheze/**.py"
      - "modern-quickstatements/**.py"
      - "shinto-label-generator/**.py"
      - "recreate-deleted-wikidata/**.py"
      - "jinjacho/**.py"
      - "tests/**.py"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # hanja + pykakasi: needed since test_shikinaisha_lists.py imports the
        # shikinaisha-list generator, which pulls the Korean pipeline (same
        # dep list as label-generator-regenerate.yml).
        run: pip install pytest requests mwclient opencc-python-reimplemented hanja pykakasi wunsen aksharamukha

      - name: Run tests
        # The root tests/ dir was missing from this list, so its 9 tests
        # (test_remote_queue_missing_lead.py) had never run in CI.
        run: python -m pytest tests/ shinto_miraheze/tests/ modern-quickstatements/tests/ shinto-label-generator/tests/ recreate-deleted-wikidata/tests/ fandom/tests/ jinjacho/tests/ -q
