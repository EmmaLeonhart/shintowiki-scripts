name: Tests

# Runs the pytest suite so regressions are caught in CI — notably the
# 2026-06-07 git-synced clobber fix (sync_revision_aware.resolve_conflict),
# which previously had zero tests. Paths-filtered to Python changes so the
# orchestrator/state-commit churn ([skip ci]) doesn't trigger it.
on:
  push:
    paths:
      - "shinto_miraheze/**.py"
      - "modern-quickstatements/**.py"
      - "shinto-label-generator/**.py"
      - "recreate-deleted-wikidata/**.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "shinto_miraheze/**.py"
      - "modern-quickstatements/**.py"
      - "shinto-label-generator/**.py"
      - "recreate-deleted-wikidata/**.py"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        # hanja + pykakasi: needed since test_shikinaisha_lists.py imports the
        # shikinaisha-list generator, which pulls the Korean pipeline (same
        # dep list as label-generator-regenerate.yml).
        run: pip install pytest requests mwclient opencc-python-reimplemented hanja pykakasi wunsen

      - name: Run tests
        run: python -m pytest shinto_miraheze/tests/ modern-quickstatements/tests/ shinto-label-generator/tests/ recreate-deleted-wikidata/tests/ fandom/tests/ -q
