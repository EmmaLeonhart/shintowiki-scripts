name: Namespace Orchestrator Runner

# Reusable single-namespace orchestrator runner. Invoked by cleanup-loop.yml
# for each per-namespace orchestrator module (user_orchestrator,
# project_orchestrator, file_orchestrator, help_orchestrator,
# geojson_orchestrator, module_orchestrator, item_orchestrator,
# property_orchestrator, talk_orchestrator).
#
# Replaces the old monolithic miscellaneous-orchestrator.yml that swept
# 9 namespaces in one job under one shared edit budget. Splitting them
# out gives per-namespace edit-limit control: e.g. talk pages (low-stakes)
# can take a smaller share than User pages, etc.

on:
  workflow_dispatch:
    inputs:
      module_name:
        description: "Orchestrator module name, e.g. user_orchestrator"
        type: string
        required: true
      display_name:
        description: "Human-readable name for state commit message"
        type: string
        required: true
      enable_history_offload:
        type: boolean
        default: false
      enable_revdel:
        type: boolean
        default: false
      enable_interlang_consolidate:
        type: boolean
        default: false
      enable_fandom_mirror:
        type: boolean
        default: false
      enable_wikidata_lookup:
        type: boolean
        default: false
      edit_limit:
        type: string
        default: "10"
  workflow_call:
    inputs:
      module_name:
        type: string
        required: true
      display_name:
        type: string
        required: true
      enable_history_offload:
        type: boolean
        default: false
      enable_revdel:
        type: boolean
        default: false
      enable_interlang_consolidate:
        type: boolean
        default: false
      enable_fandom_mirror:
        type: boolean
        default: false
      enable_wikidata_lookup:
        type: boolean
        default: false
      edit_limit:
        type: string
        default: "10"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ns-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WIKI_USERNAME: ${{ vars.WIKI_USERNAME }}
      WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
      WIKI_EDIT_LIMIT: ${{ inputs.edit_limit }}
      ENABLE_HISTORY_OFFLOAD: ${{ inputs.enable_history_offload && '1' || '' }}
      ENABLE_REVDEL: ${{ inputs.enable_revdel && '1' || '' }}
      ENABLE_INTERLANG_CONSOLIDATE: ${{ inputs.enable_interlang_consolidate && '1' || '' }}
      ENABLE_FANDOM_MIRROR: ${{ inputs.enable_fandom_mirror && '1' || '' }}
      ENABLE_WIKIDATA_LOOKUP: ${{ inputs.enable_wikidata_lookup && '1' || '' }}
      FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
      FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
    steps:
      - name: Checkout (tip of branch, not trigger SHA)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Configure SSH for XML archive repo
        env:
          ARCHIVE_REPO_DEPLOY_KEY: ${{ secrets.ARCHIVE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ARCHIVE_REPO_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Validate required secrets
        run: |
          if [ -z "${WIKI_USERNAME}" ] || [ -z "${WIKI_PASSWORD}" ]; then
            echo "WIKI_USERNAME variable and WIKI_PASSWORD secret are required."
            exit 1
          fi
          if [[ "${WIKI_USERNAME}" != *"@"* ]]; then
            echo "WIKI_USERNAME must use bot-password format, e.g. EmmaBot@EmmaBot."
            exit 1
          fi

      - name: Configure git and run tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x shinto_miraheze/commit_state.sh

          RUN_PATH="${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "${GITHUB_EVENT_NAME}" in
            push)              CAUSE="commit triggered pipeline" ;;
            schedule)          CAUSE="time triggered pipeline" ;;
            workflow_dispatch) CAUSE="manual triggered pipeline" ;;
            *)                 CAUSE="pipeline run" ;;
          esac
          echo "RUN_TAG=[[github:${RUN_PATH}|${CAUSE}]]" >> "$GITHUB_ENV"

      # Week-long wiki-editing lockout guard (Emma 2026-07-11). Skip the whole
      # sweep while the lockout is in force. See docs/wiki_403_audit_2026-07-11.md.
      - name: Wiki-editing lockout guard
        id: lockout
        run: |
          if python3 shinto_miraheze/wiki_edit_allowed.py; then
            echo "locked=false" >> "$GITHUB_OUTPUT"
          else
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki-editing lockout::Wiki editing is locked — skipping this orchestrator run."
          fi

      - name: "Run orchestrator"
        if: steps.lockout.outputs.locked != 'true'
        run: |
          python3 -m "shinto_miraheze.orchestrators.${{ inputs.module_name }}" \
            --apply --max-edits "$WIKI_EDIT_LIMIT" --run-tag "${RUN_TAG}"

      - name: "Commit state"
        if: always()
        run: shinto_miraheze/commit_state.sh "${{ inputs.display_name }}"
