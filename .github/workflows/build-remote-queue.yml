name: Build Remote Queue

# Generates remote_queue.json — a list of (file, instruction) items for
# a remote Claude cron to work through. Per the queue plan in
# queue.md, the goal is autonomous self-healing wiki maintenance so
# the project can run without ongoing manual attention.
#
# Runs daily at 04:00 UTC and on manual dispatch. Commits the queue
# back to main only if it changed. The consumer (separate remote
# Claude worker, not in this repo) reads remote_queue.json off the
# default branch.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Lockout guard (Emma 2026-07-27). The guard was originally only wired into
      # the wiki-WRITING workflows, so read-only jobs like this one kept hitting
      # Miraheze all through the 403. "Locked" now means zero traffic, reads
      # included. Only the wiki-touching step is gated — remote_queue.py below is
      # repo-local and must keep running so the cloud routine has a fresh queue.
      - name: Wiki-editing lockout guard
        id: lockout
        run: |
          if python3 shinto_miraheze/wiki_edit_allowed.py; then
            echo "locked=false" >> "$GITHUB_OUTPUT"
          else
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki-editing lockout::Wiki editing is locked — skipping the category-translation populate (the queue rebuild still runs)."
          fi

      # Queue item 5: refresh the category-translation residual work-files so the
      # remote routine always has fresh Japanese-category-name RAG items. Reads
      # the wiki + Wikidata (no creds needed), skips categories already queued,
      # writes category_translation/*.wiki. Non-fatal so a wiki hiccup doesn't
      # block the queue rebuild.
      - name: Populate category-translation residual queue
        if: steps.lockout.outputs.locked != 'true'
        run: python3 shinto_miraheze/build_category_translation_queue.py || echo "populate non-fatal"

      - name: Build queue
        run: python3 remote_queue.py

      - name: Commit queue if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add category_translation/ 2>/dev/null || true
          if git diff --quiet remote_queue.json && git diff --cached --quiet; then
            echo "remote_queue.json + queue files unchanged; nothing to commit."
            exit 0
          fi
          git add remote_queue.json
          git commit -m "chore: rebuild remote_queue.json [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; pulling --rebase and retrying"
            git pull --rebase
          done
          echo "All push attempts exhausted" >&2
          exit 1
