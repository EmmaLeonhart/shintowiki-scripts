name: Independent Pages Sync

# Syncs pages tagged [[Category:Independently git synced pages]] on
# BOTH wikis. The category is intentionally present on each wiki for
# pages whose miraheze and fandom versions are intentionally different
# (e.g. Lua-aware vs HTTPS-shim). Each wiki gets its own git directory
# and its own bidirectional sync script — there is NO wiki-to-wiki
# replication.
#
# Architecture:
#   shinto.miraheze.org  ⇄  miraheze_unique/<title>.wiki
#   shinto.fandom.com    ⇄  fandom_unique/<title>.wiki
#
# Each page that is genuinely meant to be synced carries the literal
# [[Category:Independently git synced pages]] tag inside its repo .wiki
# file (in <noinclude> for templates), so the two sync scripts converge
# on the same title set on their own. (A preflight pass,
# propagate_independent_category, used to add the tag wiki-side every
# run; it was a 2026-05-05 bootstrap and was removed 2026-05-30 once
# propagation was complete — left active it fought the repo-wins sync
# and churned pages. See DEVLOG 2026-05-30.)
#
# Renamed from "Fandom Sync" 2026-05-05. The previous design was a
# bidirectional wiki↔wiki sync gated by [[Category:Fandom sync]] on
# miraheze; that design clobbered miraheze content with fandom
# divergent edits whenever fandom-side revid bumped, and is removed.

on:
  workflow_dispatch:
    inputs:
      max_edits:
        description: "Per-run cap on combined wiki edits (default 50)"
        type: string
        default: "50"
  workflow_call:
  schedule:
    # Every 15 minutes (~96/day). Bumped up from 1/day on 2026-05-14 —
    # a daily cadence meant wiki edits sat unsynced for up to 24h, and
    # any genuine wiki edit racing with a repo edit had nearly a full
    # day to accumulate before the conflict-resolver saw it. With
    # `concurrency.cancel-in-progress` below, overlapping fires can't
    # pile up.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: independent-pages-sync
  cancel-in-progress: true

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  independent-pages-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WIKI_USERNAME: ${{ vars.WIKI_USERNAME }}
      WIKI_PASSWORD: ${{ secrets.WIKI_PASSWORD }}
      FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
      FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
      WIKI_EDIT_LIMIT: ${{ inputs.max_edits || '50' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Full history so most-recent-edit-wins can read per-file commit
          # times; a shallow checkout makes the resolver fall back to
          # repo-wins and clobber human wiki edits. Load-bearing.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Week-long wiki-editing lockout guard (Emma 2026-07-11). This sync
      # reads/writes shinto.miraheze.org (miraheze_unique + the Miraheze→fandom
      # bootstrap); while the lockout is in force we skip every sync step so we
      # stop hitting the Miraheze anti-DDoS 403. See docs/wiki_403_audit_2026-07-11.md.
      - name: Wiki-editing lockout guard
        id: lockout
        run: |
          if python3 shinto_miraheze/wiki_edit_allowed.py; then
            echo "locked=false" >> "$GITHUB_OUTPUT"
          else
            echo "locked=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wiki-editing lockout::Wiki editing is locked — skipping the independent-pages sync this run."
          fi

      - name: Install dependencies
        run: pip install mwclient requests

      - name: Validate required secrets
        run: |
          if [ -z "${WIKI_USERNAME}" ] || [ -z "${WIKI_PASSWORD}" ]; then
            echo "WIKI_USERNAME variable and WIKI_PASSWORD secret are required."
            exit 1
          fi
          if [[ "${WIKI_USERNAME}" != *"@"* ]]; then
            echo "WIKI_USERNAME must use bot-password format, e.g. EmmaBot@EmmaBot."
            exit 1
          fi
          if [ -z "${FANDOM_USERNAME}" ] || [ -z "${FANDOM_PASSWORD}" ]; then
            echo "FANDOM_USERNAME and FANDOM_PASSWORD secrets are required."
            exit 1
          fi

      - name: Configure git and environment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x shinto_miraheze/run_step.sh shinto_miraheze/commit_state.sh

          RUN_PATH="${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          case "${GITHUB_EVENT_NAME}" in
            push)              CAUSE="commit triggered pipeline" ;;
            schedule)          CAUSE="time triggered pipeline" ;;
            workflow_dispatch) CAUSE="manual triggered pipeline" ;;
            *)                 CAUSE="pipeline run" ;;
          esac
          echo "RUN_TAG=[[github:${RUN_PATH}|${CAUSE}]]" >> "$GITHUB_ENV"

      # One-shot legacy migration: rename the legacy [[Category:Fandom
      # sync]] to [[Category:Independently git synced pages]] on every
      # miraheze page that still uses the old name. Idempotent — a no-op
      # once the migration is complete.
      - name: "Independent sync: rename_fandom_sync_category (legacy)"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          shinto_miraheze/run_step.sh "Independent Sync: rename_fandom_sync_category" \
            python3 shinto_miraheze/rename_fandom_sync_category.py --apply --max-edits "$WIKI_EDIT_LIMIT" --run-tag "${RUN_TAG}"

      # Refresh the auto-generated "== Shrines with this name ==" block
      # on every shrine disambig page BEFORE the per-wiki sync steps,
      # so that any Wikidata-side additions propagate to BOTH wikis in
      # the same cycle. The script walks miraheze_unique/ for pages
      # carrying the `<!-- shrine-disambig-page -->` marker, SPARQLs
      # Wikidata for each kanji name, and writes the marked block to
      # both miraheze_unique/<name>.wiki and fandom_unique/<name>.wiki.
      # No shintowiki / fandom load — Wikidata-only.
      - name: "Independent sync: refresh shrine disambig Wikidata lists"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          shinto_miraheze/run_step.sh "Independent Sync: generate_shrine_disambig_lists" \
            python3 shinto_miraheze/generate_shrine_disambig_lists.py --apply --max-edits 200 --run-tag "${RUN_TAG}"

      - name: "Independent sync: sync_miraheze_unique_pages"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          shinto_miraheze/run_step.sh "Independent Sync: sync_miraheze_unique_pages" \
            python3 shinto_miraheze/sync_miraheze_unique_pages.py --apply --max-edits "$WIKI_EDIT_LIMIT" --run-tag "${RUN_TAG}"

      # After miraheze pulls new entries into miraheze_unique/, copy any
      # not-yet-tracked title across to fandom_unique/ so the fandom sync
      # has a starting point. Existing fandom_unique/ files (intentional
      # overrides like Portable Infoboxes, HTTPS-shim Wikidata link) are
      # preserved.
      - name: "Independent sync: bootstrap_seed_fandom_unique_from_miraheze"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          shinto_miraheze/run_step.sh "Independent Sync: bootstrap_seed_fandom_unique" \
            python3 shinto_miraheze/bootstrap_seed_fandom_unique_from_miraheze.py

      - name: "Independent sync: sync_fandom_unique_pages"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          shinto_miraheze/run_step.sh "Independent Sync: sync_fandom_unique_pages" \
            python3 shinto_miraheze/sync_fandom_unique_pages.py --apply --max-edits "$WIKI_EDIT_LIMIT" --run-tag "${RUN_TAG}"

      # Commit the actual page-content directories. Without this step,
      # the .wiki files pulled by the sync scripts stay unstaged in the
      # working tree, and commit_state.sh's `git rebase` then aborts with
      # "you have unstaged changes" — silently dropping the state file
      # commit too. Modeled on the equivalent step in git-synced-sync.yml.
      - name: "Commit: miraheze_unique/ + fandom_unique/ changes"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: |
          git add -A miraheze_unique/ fandom_unique/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No miraheze_unique/ or fandom_unique/ changes to commit."
          else
            git commit -m "chore(unique): sync independent pages [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && echo "Unique-pages changes pushed." || echo "WARNING: failed to push unique-pages changes."
          fi

      - name: "Commit state: Independent Pages Sync"
        if: always() && steps.*.outcome != 'cancelled' && steps.lockout.outputs.locked != 'true'
        run: shinto_miraheze/commit_state.sh "Independent Pages Sync"
