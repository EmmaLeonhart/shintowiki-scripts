name: Regenerate label-generator QuickStatements

# Relocated from the shinto-label-generator repo (merged here as a subtree under
# shinto-label-generator/). Regenerates the per-language proposed-label
# QuickStatements (quickstatements/<lang>.txt) + docs. The standalone repo's own
# .github/workflows/regenerate.yml is inert here (GitHub only runs root
# workflows). The Pages-deploy job from the original is intentionally dropped —
# this repo has its own Pages deploy (generate-pages.yml) and two would clash.
on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month at 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shinto-label-generator/*.py"

concurrency:
  group: label-generator-regenerate
  cancel-in-progress: false

permissions:
  contents: write

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests hanja opencc-python-reimplemented pykakasi wunsen aksharamukha

      - name: Run Toki Pona pipeline
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python fetch_shrines_tokiponize.py

      - name: Run Korean pipeline
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_korean_quickstatements.py

      - name: Run Chinese pipeline
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_chinese_quickstatements.py

      - name: Run Indonesian proposal pipeline (Japanese-only shrines)
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_indonesian_proposals.py

      - name: Run multilang pipeline
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_multilang_quickstatements.py

      # Religious buildings, ja/zh/ko. Wired 2026-09-18, the same day its output
      # moved out of paused/ and into the pipeline -- without this the files
      # would sit in quickstatements/ and never regenerate, which is exactly the
      # gap found for the stage-1 English generator on 09-17.
      #
      # ⚠ Its source is paused/religious_building_en.txt, which is FROZEN: the
      # stage-1 generator that writes it is deliberately unwired (67% of its
      # labels are not English). So this re-renders a fixed item list through the
      # current morpheme tables -- table changes flow through automatically, new
      # churches on Wikidata do not appear. That is a known limit, not a bug to
      # fix by re-enabling stage 1.
      - name: Run religious-building multilang pipeline (ja/zh/ko)
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_religious_building_multilang.py

      # Re-derives the English replacements for the stage-1 labels that reached
      # Wikidata before it was paused. Cheap; reads committed JSON, no network.
      - name: Regenerate stage-1 English replacements
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python generate_stage1_en_replacements.py

      - name: Regenerate docs HTML
        working-directory: shinto-label-generator
        continue-on-error: true
        run: python docs/generate_pages.py

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shinto-label-generator/quickstatements/ shinto-label-generator/docs/                   shinto-label-generator/religious_building_cache.json                   shinto-label-generator/paused/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(label-generator): regenerate proposed-label QuickStatements [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break || { echo "push rejected, rebasing (try $i)"; git pull --rebase --autostash || true; }
              sleep 5
            done
          fi
