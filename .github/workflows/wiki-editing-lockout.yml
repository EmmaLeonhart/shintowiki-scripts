name: Wiki-editing lockout check

# Emma 2026-07-11: after a full day of Miraheze 403 anti-DDoS challenges with no
# EmmaBot edit landing, engage a hard week-long editing lockout automatically.
#
# This job runs once daily at ~1AM PDT (08:00 UTC) and asks a single question:
# has EmmaBot edited shinto.miraheze.org in the past 8 hours?
#   * yes -> wiki editing is healthy; state stays / becomes unlocked.
#   * no  -> "gated for the week": write a lockout with locked_until = today+7d.
# If a lockout is already in force it is left untouched (not re-extended), so it
# expires on its own date and editing resumes automatically.
#
# The state file (shinto_miraheze/wiki_editing_lockout.state) is read by
# wiki_edit_allowed.py, which every scheduled wiki-WRITING workflow calls as a
# bail-early guard. See docs/wiki_403_audit_2026-07-11.md.

on:
  schedule:
    - cron: "47 8 * * *"   # ~1:00 AM PDT, off the :00 mark; "past 8h" is relative to fire time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-editing-lockout
  cancel-in-progress: false

jobs:
  lockout-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the lockout check
        env:
          WIKI_EDIT_USERNAME: ${{ vars.WIKI_USERNAME }}
        run: python shinto_miraheze/wiki_editing_lockout_check.py --apply

      - name: Commit if the lockout state changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shinto_miraheze/wiki_editing_lockout.state
          if git diff --cached --quiet; then
            echo "lockout state unchanged"
          else
            git commit -m "chore: wiki-editing lockout state update [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              git fetch origin "$GITHUB_REF_NAME" || true
              git rebase "origin/$GITHUB_REF_NAME" || git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi
