name: Direct Wikidata API Edits

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download generated QS files
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements
        continue-on-error: true

      # The "check for on-wiki attention to the watched editor" step was REMOVED
      # 2026-07-21 (Emma: ブルーノ・プラス "is not the threat that we think he is").
      # It refreshed conflict_watch.state for a global pause that no longer
      # exists. watch_conflicting_editor.py is kept on disk but is no longer run.

      # Archiving stays: read-only, never overwrites an archive already held, and
      # cheap. Emma 2026-07-10: "we should be preserving the information on them so
      # they could potentially be recreated."
      - name: Archive items damaged by the watched editor
        working-directory: modern-quickstatements
        run: python archive_destroyed_items.py
        continue-on-error: true

      - name: Execute edits via Wikidata API
        working-directory: modern-quickstatements
        env:
          MW_BOTNAME: ${{ secrets.MW_BOTNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python direct_daily_edits.py
