name: Direct Wikidata API Edits

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download generated QS files
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements
        continue-on-error: true

      # Refreshes conflict_watch.state, which direct_daily_edits reads to decide
      # whether it may run at all. Read-only: it never edits or posts anywhere.
      # If this step fails the state file is stale or absent, and the editor
      # fails CLOSED — that is the intended behaviour, so `continue-on-error`.
      # See docs/bruno_plus_analysis_2026-07.md.
      - name: Check for on-wiki attention to the watched editor
        working-directory: modern-quickstatements
        run: python watch_conflicting_editor.py
        continue-on-error: true

      # Captures the pre-damage state of any item the watched editor has newly
      # gutted. Read-only; never overwrites an archive already held. Runs even
      # while the drip is paused — that is exactly when the damage accumulates.
      # Emma 2026-07-10: "we should be preserving the information on them so they
      # could potentially be recreated."
      - name: Archive items damaged by the watched editor
        working-directory: modern-quickstatements
        run: python archive_destroyed_items.py
        continue-on-error: true

      # ⛔ WIKIDATA LOCKOUT GUARD. Single source of truth:
      # shinto_miraheze/wikidata_editing_lockout.state (Emma 2026-08-18 — no Wikidata
      # editing for a month, through 2026-09-17). No date is duplicated here; the guard
      # exits 1 while locked. The script below ALSO checks it in code, so this step is
      # belt-and-braces — it just stops the run before it even logs in, and makes the
      # skip visible in the run log rather than buried in the script's stdout.
      - name: Wikidata lockout guard
        id: wikidata_lockout
        run: |
          if python3 shinto_miraheze/wikidata_edit_allowed.py; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wikidata lockout::LOCKED — skipping all Wikidata writes."
          fi

      - name: Execute edits via Wikidata API
        if: steps.wikidata_lockout.outputs.open == 'true'
        working-directory: modern-quickstatements
        env:
          MW_BOTNAME: ${{ secrets.MW_BOTNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python direct_daily_edits.py
