name: Direct Wikidata API Edits

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ⏱ SEPTEMBER-ONLY TIMEOUT WINDOW. Emma, 2026-09-06: "raise the timeout minutes
  # temporarily only in September if that's possible."
  #
  # Why it is needed: she raised _DEFAULT_MAX_EDITS from 300 to 500 the same day, and
  # 500 does not fit the standing 360-minute timeout. Measured on run 34059230955 at
  # ~61s per line (the midpoint of the [30, 90]s random delay), 500 lines is ~8.5h,
  # so the job would be killed around line 360 every night and report red while having
  # done most of its work. 540 minutes (9h) covers 500 lines at that rate.
  #
  # Why a job and not a literal: GitHub expressions have no date function, but
  # `timeout-minutes` accepts an expression and the `needs` context is available to
  # it. So the month is computed in a step, where `date` exists, and handed up.
  #
  # It EXPIRES BY ITSELF on 2026-10-01 — no revert, no diary entry, nothing to
  # remember. That is deliberate and matches the same rule the edit cap follows
  # (Emma 2026-07-06: "reverting a config value is how things break — express the
  # exception as a rule instead"). If 500 is still wanted in October, widen the
  # condition; do not reach for a manual edit on the 1st.
  timeout-window:
    runs-on: ubuntu-latest
    outputs:
      minutes: ${{ steps.pick.outputs.minutes }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          if [ "$month" = "2026-09" ]; then
            echo "minutes=540" >> "$GITHUB_OUTPUT"
            echo "::notice title=Extended timeout::$month — 540 min, the September window for the 500-line cap."
          else
            echo "minutes=360" >> "$GITHUB_OUTPUT"
            echo "::notice title=Standard timeout::$month — 360 min. The September window has expired; if runs are now hitting the timeout, the 500 cap in direct_daily_edits.py is the thing to revisit."
          fi

  edit:
    needs: timeout-window
    runs-on: ubuntu-latest
    # fromJSON because timeout-minutes wants a number and step outputs are strings.
    timeout-minutes: ${{ fromJSON(needs.timeout-window.outputs.minutes) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download generated QS files
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements
        continue-on-error: true

      # Refreshes conflict_watch.state, which direct_daily_edits reads to decide
      # whether it may run at all. Read-only: it never edits or posts anywhere.
      # If this step fails the state file is stale or absent, and the editor
      # fails CLOSED — that is the intended behaviour, so `continue-on-error`.
      # See docs/bruno_plus_analysis_2026-07.md.
      - name: Check for on-wiki attention to the watched editor
        working-directory: modern-quickstatements
        run: python watch_conflicting_editor.py
        continue-on-error: true

      # Captures the pre-damage state of any item the watched editor has newly
      # gutted. Read-only; never overwrites an archive already held. Runs even
      # while the drip is paused — that is exactly when the damage accumulates.
      # Emma 2026-07-10: "we should be preserving the information on them so they
      # could potentially be recreated."
      - name: Archive items damaged by the watched editor
        working-directory: modern-quickstatements
        run: python archive_destroyed_items.py
        continue-on-error: true

      # ⛔ WIKIDATA LOCKOUT GUARD. Single source of truth:
      # shinto_miraheze/wikidata_editing_lockout.state (Emma 2026-08-18 — no Wikidata
      # editing for a month, through 2026-09-17). No date is duplicated here; the guard
      # exits 1 while locked. The script below ALSO checks it in code, so this step is
      # belt-and-braces — it just stops the run before it even logs in, and makes the
      # skip visible in the run log rather than buried in the script's stdout.
      - name: Wikidata lockout guard
        id: wikidata_lockout
        run: |
          if python3 shinto_miraheze/wikidata_edit_allowed.py; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wikidata lockout::LOCKED — skipping all Wikidata writes."
          fi

      - name: Execute edits via Wikidata API
        if: steps.wikidata_lockout.outputs.open == 'true'
        working-directory: modern-quickstatements
        env:
          MW_BOTNAME: ${{ secrets.MW_BOTNAME }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python direct_daily_edits.py
