name: Generate shrines-missing-en-label list

# Refreshes the synced worklist of Shinto shrines on Wikidata that lack an
# English label, every 24h. The daily translation feed (a LOCAL cron) consumes
# one item at a time and emits an en-label QuickStatement.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"  # daily ~05:17 UTC (off-peak, off the :00 mark)

permissions:
  contents: write

concurrency:
  group: generate-shrines-missing-en-label
  cancel-in-progress: false

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # ⚠ The eight generation steps below are `continue-on-error` + `id`, and the
      # LAST step of the job re-fails it if any of them failed. Both halves matter,
      # because this workflow and its sibling have failed in OPPOSITE directions:
      #
      #   * Here (red 2026-09-16 and 09-17): the temple Stage 2 query is the biggest
      #     of the run (~6,114 distinct ja labels) and got a 429. Bailing on 429 is
      #     correct repo policy. But the commit is a LATER step, so five steps that
      #     had already succeeded had their output computed and thrown away, twice.
      #     Last refresh on main was 2026-09-15.
      #   * The sibling (generate-quickstatements.yml, line 36): blanket
      #     `continue-on-error: true` with nothing re-failing the job, so a 429 bail
      #     reports GREEN and the file silently stops regenerating —
      #     description_label_pairs.txt sat unchanged from 2026-08-02 through three
      #     Sundays and nothing ever looked wrong.
      #
      # So: continue past a bail (keep the work), then go red anyway (keep it visible).
      # Do NOT add `continue-on-error` here without the re-fail step, and do NOT drop
      # the re-fail step to make the workflow look clean.
      - name: Generate list
        id: gen_shrines
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_shrines_missing_en_label.py

      - name: Generate Stage 1 deterministic kana en-labels
        id: gen_kana
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_kana_en_labels.py

      - name: Generate Stage 2 identical-name reuse en-labels
        id: gen_identical
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_identical_name_en_labels.py

      - name: Generate Japanese-temple missing-en-label worklist
        id: gen_temples
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_temples_missing_en_label.py

      - name: Generate deterministic temple en-labels ("<Stem>-<suffix> Temple")
        id: gen_temple_en
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_temple_en_labels.py

      - name: Generate Stage 2 identical-name reuse temple en-labels
        id: gen_temple_identical
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_temple_identical_name_en_labels.py

      # Replaced dedup_sonnet_labels.py 2026-09-19: that pruned only the LLM file
      # and its priority list had never learned about temples, so 13 temple/LLM
      # collisions were live and unfindable by it. This enforces one Len line per
      # item across ALL the en-label files, in stage order.
      - name: Enforce one en-label per item across the stages
        id: gen_dedup
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python dedupe_en_label_files.py

      - name: Generate C1 CJK->ja label backfill
        id: gen_cjk
        working-directory: modern-quickstatements
        continue-on-error: true
        run: python generate_cjk_ja_backfill.py

      # MUST be the last step before the commit, for the same reason it is the last
      # step in generate-quickstatements.yml: this workflow ALSO writes atomic .txt
      # files, and the husks are items ブルーノ・プラス repurposed (queue.md A5) that
      # any sitelink lookup resolves to, so generators re-emit lines targeting them.
      # Without this step the two workflows disagree — 96efe817 (this one, 2026-09-07)
      # re-added `Q134886554|Len|"Chikadono Shrine"` to identical_name_en_labels.txt
      # and turned tests/test_repurposed_husks_never_edited.py red on main until
      # af5eb701 (the other one, 2026-09-10) stripped it again. The submitter's
      # item_is_editable() refusal is still the load-bearing gate; this keeps the
      # staged files clean too.
      # NOT continue-on-error: if this cannot run, husk lines stay staged.
      - name: Strip QuickStatements targeting repurposed husks
        working-directory: modern-quickstatements
        run: python strip_husk_lines.py --apply

      - name: Commit refreshed list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modern-quickstatements/shrines_missing_en_label.json modern-quickstatements/kana_en_labels.txt modern-quickstatements/identical_name_en_labels.txt modern-quickstatements/en_labels_sonnet.txt modern-quickstatements/cjk_ja_backfill.txt modern-quickstatements/temples_missing_en_label.json modern-quickstatements/temple_en_labels.txt modern-quickstatements/temple_identical_name_en_labels.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh shrines-missing-en-label list [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break || { echo "push failed, rebasing (try $i)"; git pull --rebase --autostash || true; }
              sleep 5
            done
          fi

      # MUST be last, and must be after the commit: the point is that what succeeded
      # is committed AND the job still goes red. A 429 from WDQS is the expected
      # reason to land here; it is not a defect in this repo, but it does mean the
      # named file did not regenerate today, and that has to stay visible.
      - name: Re-fail if any generation step failed
        if: always()
        run: |
          failed=""
          for s in             "shrines_missing_en_label:${{ steps.gen_shrines.outcome }}"             "kana_en_labels:${{ steps.gen_kana.outcome }}"             "identical_name_en_labels:${{ steps.gen_identical.outcome }}"             "temples_missing_en_label:${{ steps.gen_temples.outcome }}"             "temple_en_labels:${{ steps.gen_temple_en.outcome }}"             "temple_identical_name_en_labels:${{ steps.gen_temple_identical.outcome }}"             "dedupe_en_label_files:${{ steps.gen_dedup.outcome }}"             "cjk_ja_backfill:${{ steps.gen_cjk.outcome }}"; do
            name="${s%%:*}"; outcome="${s##*:}"
            if [ "$outcome" = "failure" ]; then
              echo "::error::$name did not regenerate this run (step outcome: failure)"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Everything that DID succeed was committed by the previous step."
            echo "Did not regenerate:$failed"
            exit 1
          fi
          echo "All eight generation steps succeeded."
