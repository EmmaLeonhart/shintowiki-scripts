name: Submit QuickStatements

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      qs-failed:
        description: "Whether QuickStatements submission failed"
        value: ${{ jobs.submit.outputs.qs-failed }}

permissions:
  contents: write

env:
  MIRAHEZE_EMAIL: ${{ secrets.MIRAHEZE_EMAIL }}
  WIKIDATA_EMAIL: ${{ secrets.WIKIDATA_EMAIL }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # != 'success' (not == 'failure'): a submit step killed by the job
      # timeout ends as 'cancelled', and from 2026-06-22 to 2026-07-02 that
      # silently disarmed the direct-daily-edits fallback — no Wikidata
      # edits at all. Any non-success must trigger the fallback.
      qs-failed: ${{ steps.qs-submit.outcome != 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download generated QS files
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements
        continue-on-error: true

      - name: Write daily report (QS path retired 2026-07-04)
        # submit_daily_batch.py no longer calls the QS API (retired — Emma
        # ruled out its required one-time manual batch). It writes the dated
        # report the daily gate reads and exits 1 so qs-failed stays true
        # and direct-daily-edits (the only editor) fires.
        id: qs-submit
        continue-on-error: true
        working-directory: modern-quickstatements
        run: python submit_daily_batch.py

      - name: Commit and push run report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-quickstatements/reports/
          git diff --cached --quiet || git commit -m "Daily QS submission report $(date -u +%Y-%m-%d) [skip ci]"
          git stash --include-untracked || true
          git pull --rebase || true
          git stash pop || true
          # ⛔ Retry, and go red if it never lands. Both halves are load-bearing and
          # this step had neither. A bare `git push` here lost a whole day's work
          # twice in six days, in two different ways:
          #   * 2026-09-18, this workflow: `! [rejected] main -> main (fetch first)`
          #     — an ordinary race. The cleanup loop runs ~26 jobs and several of
          #     them push to main; the rebase above had already happened when
          #     another job's push arrived.
          #   * 2026-09-15, build-run-history.yml (same bare push, now also fixed):
          #     `! [remote rejected] main -> main (Internal Server Error)` — a
          #     transient on GitHub's side.
          # CLAUDE.md already says the retry loop in commit_state.sh is
          # load-bearing for exactly this: "concurrent pushes from other workflow
          # jobs were silently rejecting orchestrator state commits". ⚠ `--autostash`
          # on the retry pull is not optional — the tree is dirty at this point and
          # `test_the_push_retries_survive_a_dirty_tree` exists because a retry that
          # cannot pull is not a retry.
          # ⚠ The `exit 1` is deliberate. A loop that runs out of attempts and falls
          # through green is the failure generate-quickstatements.yml's own comment
          # warns about — the work stops landing and nothing ever looks wrong.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $attempt); rebasing and retrying"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "push still rejected after 5 attempts"
          exit 1

      - name: Note the deliberate nonzero exit
        if: steps.qs-submit.outcome != 'success'
        run: |
          echo "::notice::Deliberate: the QS path is retired; the nonzero exit routes edits to direct-daily-edits (the only Wikidata editor). Report committed above."
