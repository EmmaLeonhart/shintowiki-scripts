name: Submit QuickStatements

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      qs-failed:
        description: "Whether QuickStatements submission failed"
        value: ${{ jobs.submit.outputs.qs-failed }}

permissions:
  contents: write

env:
  MIRAHEZE_UA_CONTACT: ${{ secrets.MIRAHEZE_UA_CONTACT }}
  WIKIDATA_UA_CONTACT: ${{ secrets.WIKIDATA_UA_CONTACT }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # != 'success' (not == 'failure'): a submit step killed by the job
      # timeout ends as 'cancelled', and from 2026-06-22 to 2026-07-02 that
      # silently disarmed the direct-daily-edits fallback — no Wikidata
      # edits at all. Any non-success must trigger the fallback.
      qs-failed: ${{ steps.qs-submit.outcome != 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download generated QS files
        uses: actions/download-artifact@v5
        with:
          name: quickstatements-files
          path: modern-quickstatements
        continue-on-error: true

      - name: Write daily report (QS path retired 2026-07-04)
        # submit_daily_batch.py no longer calls the QS API (retired — Emma
        # ruled out its required one-time manual batch). It writes the dated
        # report the daily gate reads and exits 1 so qs-failed stays true
        # and direct-daily-edits (the only editor) fires.
        id: qs-submit
        continue-on-error: true
        working-directory: modern-quickstatements
        run: python submit_daily_batch.py

      - name: Commit and push run report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modern-quickstatements/reports/
          git diff --cached --quiet || git commit -m "Daily QS submission report $(date -u +%Y-%m-%d) [skip ci]"
          git stash --include-untracked || true
          git pull --rebase || true
          git stash pop || true
          git push

      - name: Note the deliberate nonzero exit
        if: steps.qs-submit.outcome != 'success'
        run: |
          echo "::notice::Deliberate: the QS path is retired; the nonzero exit routes edits to direct-daily-edits (the only Wikidata editor). Report committed above."
